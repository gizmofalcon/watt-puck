<style>
  :root { --bg: #F4F3EF; --ink: #1D1D1F; --mute: rgba(29, 29, 31, 0.62); --faint: rgba(29, 29, 31, 0.46); --y: #FFD60A; --sel: #2F7CF6;
    --card: rgba(255, 255, 255, 0.94); --lift: 0 1px 2px rgba(40, 50, 70, 0.08), 0 10px 30px rgba(40, 50, 70, 0.12); --ease: cubic-bezier(0.16, 1, 0.3, 1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color-scheme: light; overflow: hidden; }
  body { color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; touch-action: none;
    font: 600 16px/24px "Nunito", ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  b { font-weight: inherit; color: var(--ink); }
  /* the airfield: the ground and everything on it (WebGL), and over it the tags, rings and paths */
  #ground, #map { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  #ground { pointer-events: none; }
  body.playing #map { cursor: crosshair; }
  body.playing.over-plane #map { cursor: pointer; }

  .btn { display: inline-flex; align-items: center; justify-content: center; height: 42px; padding: 0 20px; border: 0; border-radius: 21px; cursor: pointer;
    background: var(--y); color: #000; font: inherit; font-size: 15px; font-weight: 800; white-space: nowrap;
    transition: filter 0.16s, transform 0.16s var(--ease), background-color 0.16s; }
  .btn:hover { filter: brightness(1.04); }
  .btn:active { transform: scale(0.97); }
  .btn.quiet { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: var(--lift); }
  .btn.quiet:hover { filter: none; background: #FFFFFF; }
  .btn.small { height: 34px; padding: 0 14px; border-radius: 17px; font-size: 14px; }
  .btn svg { width: 8px; height: 12px; margin-right: 8px; opacity: 0.55; }
  :focus-visible { outline: 2px solid var(--sel); outline-offset: 3px; }

  /* along the top: the way back; the time of day, planes down, close calls, and which way they land */
  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; pointer-events: none; z-index: 2; }
  .hud > * { pointer-events: auto; }
  .stock { display: flex; align-items: center; gap: 16px; height: 34px; padding: 0 16px; border-radius: 17px; background: var(--card); box-shadow: var(--lift);
    font: 500 13.5px/1 "Roboto Mono", ui-monospace, Menlo, monospace; color: var(--mute); }
  .stock span { display: flex; align-items: center; gap: 7px; transition: color 0.3s; }
  .stock svg { width: 16px; height: 16px; flex: none; }
  .stock b { font-weight: 500; color: var(--ink); transition: color 0.3s; }
  .stock .bump { animation: bump 0.35s var(--ease); }
  .stock .warn, .stock .warn b { color: #D9531E; }
  #windArrow { transition: transform 1.2s var(--ease); }
  @keyframes bump { 40% { transform: scale(1.18); } }
  body.title .stock { visibility: hidden; }

  /* what just happened */
  .toasts { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none; z-index: 3; }
  .toast { display: flex; align-items: center; gap: 10px; padding: 7px 16px 7px 14px; border-radius: 18px; background: var(--card); box-shadow: var(--lift);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--ink);
    font-size: 14px; line-height: 20px; white-space: nowrap; cursor: pointer; pointer-events: auto;
    opacity: 0; transform: translateY(-6px); transition: opacity 0.4s var(--ease), transform 0.5s var(--ease); }
  .toast.show { opacity: 1; transform: none; }
  .toast i { width: 6px; height: 6px; border-radius: 50%; background: rgba(29, 29, 31, 0.3); flex: none; }
  .toast.warn i { background: #F08A24; }
  .toast.good i { background: #3FAE8C; }

  /* the puck as it looks now; it plays the game too */
  .who { position: fixed; left: 20px; bottom: 20px; display: flex; padding: 8px; border-radius: 50%; background: var(--card); box-shadow: var(--lift); z-index: 2; }
  #mirror { display: block; width: 148px; height: 148px; border-radius: 50%; cursor: pointer; touch-action: none; flex: none; }

  .panel { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; pointer-events: none; opacity: 0; transition: opacity 0.5s var(--ease); z-index: 4; }
  .panel.show { opacity: 1; }
  .panel.show .card { pointer-events: auto; }
  .card { max-width: 500px; padding: 34px 36px 32px; border-radius: 24px; background: var(--card); box-shadow: var(--lift); text-align: center;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); transform: translateY(8px); transition: transform 0.6s var(--ease); }
  .panel.show .card { transform: none; }
  .card h1 { margin: 0; font-size: 44px; line-height: 52px; font-weight: 800; letter-spacing: -0.02em; }
  .card p { margin: 14px 0 0; font-size: 18px; line-height: 28px; color: var(--mute); text-wrap: pretty; }
  .card .how { margin-top: 18px; font-size: 15px; line-height: 23px; color: var(--faint); }
  .card .go { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 16px; margin-top: 28px; }
  .card .or { font-size: 14px; color: var(--faint); }

  .hint { position: fixed; left: 200px; right: 200px; bottom: 22px; width: fit-content; max-width: calc(100% - 400px); margin: 0 auto; padding: 6px 14px; border-radius: 16px;
    background: var(--card); box-shadow: var(--lift); text-align: center; font-size: 14px; line-height: 20px; color: var(--mute); pointer-events: none; transition: opacity 0.4s; }
  .hint:empty { display: none; }
  .hint.no { color: #C2481A; }
  .conn { position: fixed; right: 24px; bottom: 20px; display: flex; align-items: center; gap: 8px; padding: 2px 12px; border-radius: 14px; background: var(--card);
    box-shadow: var(--lift); font-size: 13px; line-height: 24px; color: var(--mute); }
  .conn i { width: 7px; height: 7px; border-radius: 50%; background: rgba(29, 29, 31, 0.25); transition: background-color 0.3s, box-shadow 0.3s; }
  .conn.puck i { background: var(--sel); box-shadow: 0 0 8px rgba(47, 124, 246, 0.5); }

  @media (max-width: 960px) {

  }
  @media (max-width: 640px) {
    .hud { padding: 16px; }

    .stock .wind { display: none; }
    .toasts { top: 62px; }
    .who { left: 10px; bottom: 10px; padding: 6px; }
    #mirror { width: 112px; height: 112px; }
    .hint { bottom: 136px; }
    .conn { display: none; }
    .card h1 { font-size: 36px; line-height: 44px; }
    .card p { font-size: 17px; line-height: 26px; }
  }
</style>

<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { MarchingCubes } from "three/addons/objects/MarchingCubes.js";

// Tower: a grass airstrip among flooded rice paddies, over one day from morning to dusk. Planes call
// in from the edges. Bring each one down on the strip, into the wind, the seaplanes on the river,
// and keep them all apart. Some only pass over. Nothing crashes; close calls are counted.
//
// The puck plays it through Watt on this Mac: the page joins Watt's local bridge as a game and asks
// for the "panel" face as a compass for the picked plane: the needle where it points, a yellow arc
// where you've asked it to go, and around the rim the day going by. A swipe picks the next plane,
// turning the puck steers it (with a click every 5 degrees), a tap clears it to land once it lines
// up, and a hold makes it circle. A mouse and keys play it too, and so does the small puck on the
// page.
//
// It's drawn in 3D with three.js, from straight above: the paddies painted once and laid flat, and
// on them clay trees, the tower, the hangar and the planes, in a sun that crosses the sky.

const MAP_W = 1280, MAP_H = 820, EDGE = 26;     // the airfield and its ragged edge, in world units
const DAY = 390;                                 // seconds from morning to dusk
const RWY = { x0: 440, x1: 860, y: 440, hw: 22 };  // the strip: its two ends, its middle line, half its width
const FIELD = { x0: 402, x1: 898, y0: 398, y1: 482 };
const APRON = { x0: 468, x1: 666, y0: 334, y1: 398 };
const TOWER = { x: 504, y: 362 }, HANGAR = { x: 604, y: 361, w: 50, d: 54 }, SOCK = { x: 716, y: 401 };
const TURNOFF = 652;                             // where planes leave the strip for the hangar
const TAXI_PATH = [{ x: 652, y: 412 }, { x: 626, y: 396 }, { x: 604, y: 391 }, { x: 604, y: 352 }];
const LANE = { y0: 112, y1: 716 };               // the stretch of river seaplanes land on
const DOCK_Y = 622, BRIDGE_Y = 292;
const MID = { x: 650, y: 420 };                  // planes are picked round this point
const FUNNEL = 300;                              // how far out a plane can be cleared to land
const TD = 28, GLIDE = 0.26;                     // touchdown past the strip's end, and the slope down to it
const GLIDE_W = 170;                             // a seaplane's glide, from clearance to the water
const CRUISE = 78;
const SPEED = { air: 23, pass: 26, final: 18, taxi: 10, water: 7 };
const RATE = { turn: 26, final: 42, circle: 34 };  // degrees a second
const WARN = 90, NEAR = 52, STACK = 36;          // separation: rings inside WARN, a close call inside NEAR, unless STACK apart in height
const GAIN = 1.5;                                // degrees of heading for a degree the puck turns
const PLANE_S = 1.3;                             // planes are drawn this much larger than they're reckoned
const STEP = 1 / 60;
const D = Math.PI / 180, TAU = Math.PI * 2;
const BRIDGE = "ws://127.0.0.1:47824";
const Y = "#FFD60A";

const cv = document.getElementById("map");
const ctx = cv.getContext("2d");
const gcv = document.getElementById("ground");
const $ = (id) => document.getElementById(id);

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, f) => a + (b - a) * f;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const norm = (a) => ((a % 360) + 360) % 360;
const diff = (a, b) => ((((b - a) % 360) + 540) % 360) - 180;   // from heading a to heading b, the short way
const dirOf = (h) => ({ x: Math.sin(h * D), y: -Math.cos(h * D) });  // headings are clock degrees: 0 up, 90 right
const bearing = (x0, y0, x1, y1) => norm(Math.atan2(x1 - x0, -(y1 - y0)) / D);
const round5 = (h) => norm(Math.round(h / 5) * 5);
const hdgText = (h) => String(Math.round(norm(h)) % 360).padStart(3, "0");
const endText = (e) => String(e).padStart(2, "0");
function seeded(a) {
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rgbOf = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const lift = (c, f) => c.map((v) => (f >= 0 ? v + (255 - v) * f : v * (1 + f)));
const css = (c) => `rgb(${c.map((v) => Math.round(v)).join(", ")})`;
const tint = (h, f) => css(lift(rgbOf(h), f));

// ---------------------------------------------------------------- the land

// The river runs down the right, the road down the left, paths between the paddies
const riverX = (y) => 1038 + 22 * Math.sin(y * 0.0042 + 0.9) + 7 * Math.sin(y * 0.012 + 2.3);
const RIVER_HW = 45, BANK = 9, FRINGE = 5;
const roadX = (y) => 140 + 9 * Math.sin(y * 0.0052 + 1.1);
const ROAD_HW = 12;
const VPATHS = [318, 584, 834], HPATHS = [116, 292, 598, 738], CANALS = [200, 520, 672];
const PATH_HW = 4.5;
const TREES = [[232, 236], [452, 182], [726, 258], [930, 604], [1172, 330], [372, 664], [1194, 706], [640, 694], [78, 420], [884, 150]];
const WATER = ["#5DABD3", "#62AFDA", "#6BB5DB", "#72B8DA", "#7AC0E1", "#56A5D0", "#4D9DCB"];
const RICE = ["#5BAD93", "#53A68C", "#64B49B", "#6BBBA2", "#5DB29A", "#57AA8E"];
const SOIL = ["#A38C74", "#9D866D", "#A89279"];
const BUND = "#97D658", PATH = "#DCCAB1", ROAD = "#C3BCB4", SAND = "#E0C9A0", FRINGE_C = "#97C95A";
const DEEP = "#3E6994", SHALLOW = "#4A7DB0";
const GRASS = "#93C86B", MOWN = ["#9ACD72", "#8DC266"], RUNWAY = "#A5D27E", GRAVEL = "#E4D8C2";
const PETALS = ["#FFFFFF", "#F9EAF0", "#F6D6E1", "#EFE6F2"];
const PX = 2;                                    // the painting's pixels to a world unit
const PADDIES = [];

function inRect(x, y, r, m = 0) { return x > r.x0 - m && x < r.x1 + m && y > r.y0 - m && y < r.y1 + m; }
const onRiver = (x, y, pad = 0) => Math.abs(x - riverX(y)) < RIVER_HW + BANK + FRINGE + pad;
const onRoad = (x, y, pad = 0) => Math.abs(x - roadX(y)) < ROAD_HW + pad;
const onAirfield = (x, y, pad = 0) => inRect(x, y, FIELD, pad) || inRect(x, y, APRON, pad);

function makeBase() {
  const c = document.createElement("canvas");
  c.width = Math.round((MAP_W + 2 * EDGE) * PX);
  c.height = Math.round((MAP_H + 2 * EDGE) * PX);
  const g = c.getContext("2d");
  g.setTransform(PX, 0, 0, PX, EDGE * PX, EDGE * PX);   // world units, the map's corner at 0, 0
  const R = seeded(23);
  const X0 = -EDGE, Y0 = -EDGE, X1 = MAP_W + EDGE, Y1 = MAP_H + EDGE;
  g.fillStyle = BUND;
  g.fillRect(X0, Y0, X1 - X0, Y1 - Y0);

  // the paddies, in strips between the paths: flooded, green with rice, or bare
  const xs = [X0, ...VPATHS.flatMap((x) => [x - PATH_HW, x + PATH_HW]), X1];
  const ys = [Y0, ...HPATHS.flatMap((y) => [y - PATH_HW, y + PATH_HW]), Y1];
  for (let i = 0; i < xs.length; i += 2) for (let j = 0; j < ys.length; j += 2) block(g, R, xs[i], ys[j], xs[i + 1], ys[j + 1]);
  for (const y of CANALS) {
    g.fillStyle = "#4C8CB3"; g.fillRect(X0, y - 2, X1 - X0, 4);
    g.fillStyle = "rgba(255, 255, 255, 0.4)"; g.fillRect(X0, y - 2.7, X1 - X0, 0.8);
    g.fillStyle = "rgba(25, 60, 90, 0.22)"; g.fillRect(X0, y + 2, X1 - X0, 0.9);
  }

  // the paths: down between the blocks, and across, up to the river (over it on the bridge)
  g.fillStyle = PATH;
  for (const x of VPATHS) g.fillRect(x - PATH_HW, Y0, PATH_HW * 2, Y1 - Y0);
  for (const y of HPATHS) g.fillRect(X0, y - PATH_HW, X1 - X0, PATH_HW * 2);
  g.fillStyle = "rgba(255, 255, 255, 0.28)";
  for (const x of VPATHS) { g.fillRect(x - PATH_HW, Y0, 0.8, Y1 - Y0); g.fillRect(x + PATH_HW - 0.8, Y0, 0.8, Y1 - Y0); }
  for (const y of HPATHS) { g.fillRect(X0, y - PATH_HW, X1 - X0, 0.8); g.fillRect(X0, y + PATH_HW - 0.8, X1 - X0, 0.8); }
  g.fillStyle = PATH;
  g.fillRect(516, BRIDGE_Y, 9, APRON.y0 - BRIDGE_Y + 2);   // a lane up to the tower

  // the road, with its dashes
  const along = (fx, step = 5) => { const pts = []; for (let y = Y0 - 10; y <= Y1 + 10; y += step) pts.push([fx(y), y]); return pts; };
  const line = (pts, col, w, dash) => {
    g.strokeStyle = col; g.lineWidth = w; g.lineJoin = "round"; g.setLineDash(dash || []);
    g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke(); g.setLineDash([]);
  };
  line(along(roadX), "#B5AEA6", ROAD_HW * 2 + 2.4);
  line(along(roadX), ROAD, ROAD_HW * 2);
  line(along((y) => roadX(y) - ROAD_HW + 2.2), "#D6D0C7", 1);
  line(along((y) => roadX(y) + ROAD_HW - 2.2), "#D6D0C7", 1);
  line(along(roadX, 2), "#EEE8E1", 1.3, [7, 7]);

  // the river: green at its edges, a sandy bank, shallows, the deep middle, and the current
  const band = (w0, w1, col) => {
    g.fillStyle = col; g.beginPath();
    for (let y = Y0 - 10; y <= Y1 + 10; y += 4) g.lineTo(riverX(y) + w0, y);
    for (let y = Y1 + 10; y >= Y0 - 10; y -= 4) g.lineTo(riverX(y) + w1, y);
    g.closePath(); g.fill();
  };
  const W1 = RIVER_HW + BANK + FRINGE;
  if ("filter" in g) g.filter = "blur(1.2px)";
  band(-W1, W1, FRINGE_C);
  band(-(W1 - 1.6), W1 - 1.6, "#BEC57F");
  band(-(RIVER_HW + BANK), RIVER_HW + BANK, SAND);
  band(-(RIVER_HW + 1.8), RIVER_HW + 1.8, "#B9B3A6");
  band(-RIVER_HW, RIVER_HW, SHALLOW);
  band(-(RIVER_HW - 3), RIVER_HW - 3, "#4579AC");
  band(-(RIVER_HW - 10), RIVER_HW - 10, DEEP);
  if ("filter" in g) g.filter = "none";
  for (let k = 0; k < 7; k++) {
    const off = -RIVER_HW + 8 + k * 11 + R() * 4, ph = R() * 9;
    line(along((y) => riverX(y) + off + 2.4 * Math.sin(y * 0.03 + ph), 3), k % 2 ? "rgba(98, 140, 196, 0.45)" : "rgba(52, 92, 140, 0.5)", 1.2, [30 + R() * 50, 20 + R() * 40]);
  }
  // the path across, over the bridge
  g.fillStyle = PATH;

// ---------------------------------------------------------------- the day

let G = null, state = "title", stateAt = 0, now = 0, selId = 0, lastInput = "mouse";
let best = 0, prevBest = 0, newBest = false;
try { best = Number(localStorage.getItem("tower.best")) || 0; } catch {}
const pk = { s: "", sn: 0, inputAt: -1e9 };
const puckSound = (s) => { pk.s = s; pk.sn++; };
let flashFace = null, flashSub = null, hintFlash = null;

const LOOKS = [
  { body: "#F7F3EA", col: "#E8705A" }, { body: "#F7F3EA", col: "#4F8FD6" }, { body: "#F6F2E9", col: "#E3B23C" }, { body: "#F7F3EA", col: "#9A6BC4" },
  { body: "#EEF2F6", col: "#D9534A" }, { body: "#F7F3EA", col: "#2E9C82" }, { body: "#F4EFE6", col: "#EE8E3B" }, { body: "#F7F3EA", col: "#3666AE" },

const NAMES = { strip: ["Kite", "Lark", "Wren", "Swift", "Finch", "Robin", "Martin", "Plover", "Linnet", "Dove", "Starling", "Swallow"],

function newDay(seed = (Math.random() * 1e9) | 0, demo = false) {
  const R = seeded(seed);
  return { R, seed, demo, t: 0, planes: [], pending: [], ids: 1, nextAt: 2.5, calls: 0,
    wind: R() < 0.5 ? 27 : 9, windAt: [DAY * (0.36 + R() * 0.1), R() < 0.55 ? DAY * (0.72 + R() * 0.08) : Infinity], windTurnedAt: -99,
    landed: 0, onRiver: 0, passed: 0, close: 0, diverted: 0, pairs: new Set(), events: [], over: false, duskSaid: false, swipes: 0, cleared: 0, steered: 0 };
}
const emit = (k, o = {}) => G.events.push({ k, ...o });
const inAir = (p) => p.st === "air" || p.st === "circle" || p.st === "final";

function callsign(kind) {
  const R = G.R, list = NAMES[kind], used = new Set([...G.planes, ...G.pending.map((c) => c.p)].map((p) => p.name));
  for (let i = 0; i < 30; i++) { const n = `${list[(R() * list.length) | 0]} ${1 + ((R() * 9) | 0)}`; if (!used.has(n)) return n; }
  return `${list[0]} ${G.ids}`;
}

// A plane calling in: where it comes from (an edge, away from the others, not under the puck in the
// corner), and where it's heading
function makePlane(kind) {
  const R = G.R, first = G.calls === 0;
  let x, y, hdg, exit = null;
  if (first) {   // the first comes in almost lined up, to show how
    const e = G.wind === 27;
    x = e ? MAP_W + 24 : -24; y = RWY.y + (e ? -62 : 62); hdg = e ? 260 : 80;
  } else {
    let ok = false;

    for (let i = 0; i < 40 && !ok; i++) {

      if (side === "t") { x = 90 + R() * (MAP_W - 180); y = -24; }
      else if (side === "b") { x = 260 + R() * (MAP_W - 350); y = MAP_H + 24; }

const maxAir = () => (G.t < 110 ? 4 : G.t < 230 ? 5 : 6);
function kindNext() {
  if (G.calls < 2) return "strip";
  const r = G.R();

  if (G.t > 80 && r > 0.84) return "pass";
  return "strip";
}
function schedule() {

  G.pending = G.pending.filter((c) => !c.done);
  if (G.t < G.nextAt || G.t > DAY - 40) return;
  if (G.planes.filter(inAir).length + G.pending.length >= maxAir()) { G.nextAt = G.t + 3; return; }
  const p = makePlane(kindNext());

  G.pending.push({ p, at: G.t + 3 });
  G.calls++;

function step(dt) {
  if (!G) return;
  const live = state === "play" && !G.demo;
  if (live) {
    G.t += dt;
    schedule();
    if (G.t >= G.windAt[0]) { G.windAt.shift(); G.wind = G.wind === 27 ? 9 : 27; G.windTurnedAt = G.t; emit("wind"); }
    if (!G.duskSaid && G.t > DAY * 0.86) { G.duskSaid = true; emit("dusk"); }
  }
  for (const p of G.planes) planeStep(p, dt);
  G.planes = G.planes.filter((p) => !p.gone);

const fly = (p, dt) => { const v = dirOf(p.hdg); p.x += v.x * p.spd * dt; p.y += v.y * p.spd * dt; };

  if (p.kind === "pass") {

    return;
  }

// The strip: which end, how far out along its line, how far off it, and how far off its heading
function approach(x, y, hdg, end) {

// ---------------------------------------------------------------- picking and steering

function select(p, quiet) {

}

const around = (p) => bearing(MID.x, MID.y, p.x, p.y);

function cycle(d) {

  const next = i < 0 ? list[d > 0 ? 0 : list.length - 1] : list[(i + d + list.length) % list.length];

function autoPick() {

const SUN_FLAT = 1.75, SKY_FLAT = 1.6;   // the sun on flat ground, and the sky: together the paddies as painted
const LIGHT = [
  [0.0, [-0.80, 0.60, -0.30], "#FFE4CB", 1, "#EDF2FF", "#B4C7A0", 1, "#F5F2EE"],
  [0.25, [-0.55, 0.70, -0.45], "#FFF6EA", 1, "#F2F6FF", "#A8C79A", 1, "#F4F3EF"],
  [0.55, [0.05, 0.78, -0.62], "#FFF8EE", 1, "#F3F7FF", "#A8C79A", 1, "#F4F3EF"],
  [0.8, [0.55, 0.72, -0.44], "#FFE8CC", 0.98, "#F0EEFB", "#AFC49B", 0.98, "#F4F1EE"],
  [1.0, [0.80, 0.52, -0.40], "#FFBE92", 0.85, "#E2DAF2", "#A9AF9C", 0.88, "#EFE9E8"],
  [1.2, [0.86, 0.42, -0.40], "#FFA286", 0.45, "#C3C5EA", "#8E98A6", 0.68, "#E6E4EC"],

let bgShown = "";
function light() {

  let i = 0;
  while (i < LIGHT.length - 2 && f > LIGHT[i + 1].f) i++;
  const a = LIGHT[i], b = LIGHT[i + 1], u = clamp((f - a.f) / (b.f - a.f), 0, 1);

  sun.color.copy(a.s).lerp(b.s, u);
  sun.intensity = (SUN_FLAT / Math.max(0.3, _v.y)) * lerp(a.si, b.si, u);

// The camera sees the whole airfield, under the bar along the top
let K = 1, OX = 0, OY = 0;
const sx = (x) => OX + x * K, sy = (y) => OY + y * K;
const toWorld = (px, py) => ({ x: (px - OX) / K, y: (py - OY) / K });
function fit() {

  const aw = W - padL - padR, ah = H - padT - padB;
  K = Math.min(aw / (MAP_W + EDGE), ah / (MAP_H + EDGE));

let lastT = 0;
function syncWorld(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000 || 0);
  lastT = t;
  shared.uTime.value = t / 1000;
  const f = light();
  const dusk = state === "title" ? 0 : smooth(0.84, 0.98, f);
  syncPlanes(t, dt);
  syncCars(dt, dusk);
  syncEgrets(t, dt);
  syncClouds(dt);

// The arrows in to the strip: at the end planes land from, lighting in turn towards the strip;
// yellow while the picked plane is lined up
function syncArrows(t, dt) {

  for (const e of [9, 27]) {

function syncPlanes(t, dt) {

    const bob = inAir(p) && p.h > 20 ? Math.sin(t / 900 + p.id) * 0.8 : 0;
    o.g.position.set(p.x, p.h + bob, p.y);
    o.g.rotation.y = (90 - p.hdg) * D;
    const bank = clamp(p.rate * 0.7, -24, 24) * D * (p.h > 6 ? 1 : 0);

function syncCars(dt, dusk) {
  for (const c of CARS) {
    c.y += c.dir * c.v * dt;
    if (c.y > MAP_H + 60) c.y = -60;
    if (c.y < -60) c.y = MAP_H + 60;
    const x = roadX(c.y) + c.dir * 5.5, x2 = roadX(c.y + c.dir * 4) + c.dir * 5.5;
    c.g.position.set(x, 0, c.y);
    c.g.rotation.y = (90 - bearing(x, c.y, x2, c.y + c.dir * 4)) * D;
    c.g.visible = c.y > -14 && c.y < MAP_H + 14;
    c.lamp.material.opacity = dusk * 0.9;

// Egrets stand in the flooded paddies, look about, and now and then fly off to another
function syncEgrets(t, dt) {
  for (const e of EGRETS) {
    if (e.st === "stand") {
      e.next -= dt;
      e.neckG.rotation.z = Math.max(0, Math.sin(t / 700 + e.seed * 3)) * -0.5;
      if (e.next < 0) {
        const s = e.spot();
        if (Math.hypot(s.x - e.x, s.y - e.y) > 160) { e.st = "fly"; e.tx = s.x; e.ty = s.y; e.from = Math.hypot(s.x - e.x, s.y - e.y); }

    } else {

      e.hdg = norm(e.hdg + clamp(diff(e.hdg, want), -90 * dt, 90 * dt));
      const v = dirOf(e.hdg), sp = 22;
      e.x += v.x * sp * dt; e.y += v.y * sp * dt;
      e.h = Math.min(34, (e.from - d) * 0.5, d * 0.45);
      const flap = Math.sin(t / 95) * 0.55;
      e.wings[0].rotation.x = -flap; e.wings[1].rotation.x = flap;
      if (d < 4) { e.st = "stand"; e.h = 0; e.next = 25 + Math.random() * 70; }
    }
    for (const w of e.wings) w.visible = e.st === "fly";
    e.neckG.visible = true;
    e.g.position.set(e.x, Math.max(0, e.h) - (e.st === "fly" ? 6 : 0), e.y);
    e.g.rotation.y = (90 - e.hdg) * D;
    e.g.scale.setScalar(1.25);
  }
}

// Clouds drift with the wind, the way the windsock points
function syncClouds(dt) {
  const want = (G && G.wind === 9 ? -1 : 1) * 5;
  for (const c of CLOUDS) {
    c.v += clamp(want - c.v, -dt, dt);
    c.x += c.v * dt;
    if (c.x > MAP_W + 260) c.x = -260;
    if (c.x < -260) c.x = MAP_W + 260;
    c.m.position.set(c.x, c.h, c.y);

}

    o.stop(t + at + len + 0.02);

  if (kind === "select") { tone(1180, 0, 0.06, 0.035); tone(1770, 0.02, 0.07, 0.018); }
  else if (kind === "step") tone(2300, 0, 0.022, 0.014, "triangle");
  else if (kind === "ok") { tone(660, 0, 0.09, 0.04); tone(990, 0.06, 0.16, 0.035); }
  else if (kind === "no") tone(220, 0, 0.14, 0.05, "triangle", 150);
  else if (kind === "call") { tone(1320, 0, 0.05, 0.022); tone(1760, 0.08, 0.07, 0.02); }
  else if (kind === "down") { tone(170, 0, 0.14, 0.05, "triangle", 110); tone(784, 0.06, 0.24, 0.028); }
  else if (kind === "splash") { tone(900, 0, 0.12, 0.022, "sine", 320); tone(523, 0.08, 0.26, 0.026); }
  else if (kind === "close") { tone(520, 0, 0.12, 0.04, "triangle"); tone(440, 0.15, 0.2, 0.04, "triangle"); }
  else if (kind === "wind") { tone(620, 0, 0.6, 0.02, "sine", 380); tone(930, 0.1, 0.5, 0.012, "sine", 600); }
  else if (kind === "begin") { tone(392, 0, 0.5, 0.03); tone(523, 0.15, 0.6, 0.03); }
  else if (kind === "dusk") { [523, 659, 784].forEach((f, i) => tone(f, i * 0.16, 1.1 - i * 0.15, 0.03)); }
  else if (kind === "evening") { [784, 659, 523, 392].forEach((f, i) => tone(f, i * 0.14, 1.2 - i * 0.1, 0.035)); }
}

function count(name, params) { gtag("event", name, params); }

// ---------------------------------------------------------------- the frame

let W = innerWidth, H = innerHeight, DPR = 1;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth;
  H = innerHeight;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  const mr = mirror.getBoundingClientRect();
  mirrorSize = Math.round(mr.width) || 148;
  mirrorDPR = DPR;
  mirror.width = Math.round(mirrorSize * DPR);
  mirror.height = Math.round(mirrorSize * DPR);
  mirrorDrawn = "";
  if (worldOk) renderer.setSize(W, H, false);
  fit();
}

let last = performance.now(), acc = 0, frames = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  now = t;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 4) { step(STEP); acc -= STEP; n++; }
  if (n === 4) acc = 0;
  if (state === "play") autoPick();
  takeEvents();
  if (state === "play" && G.over) finish();
  if (worldOk) { syncWorld(t); renderer.shadowMap.needsUpdate = (frames++ & 1) === 0; renderer.render(scene, camera); }
  draw(t);
  hud();
  face(t);
  connState();
  requestAnimationFrame(frame);
}

// The painted ground needs the font for the strip's numbers
await Promise.race([document.fonts.load("800 21px Nunito"), new Promise((r) => setTimeout(r, 1500))]).catch(() => {});
const base = makeBase();
initWorld();
if (worldOk) { makeGround(base); makeStatics(); makeLife(); }
addEventListener("resize", resize);
backdrop();
resize();
showPanel();
connect();
requestAnimationFrame(frame);

// For tests: the day's state and a few of its moves, from the browser's console or a script
window.tower = {
  get G() { return G; }, get state() { return state; }, get world() { return worldOk; },
  get three() { return { renderer, scene, camera, sun, hemi }; },
  start, select, selected, steer, pointAt, press, hold, cycle, whyNot, approach, makePlane, base, PADDIES, sx, sy,
  run: (s) => { for (let i = 0; i < s * 60; i++) { step(STEP); if (state === "play") autoPick(); } takeEvents(); },
  skip: (s) => { G.t += s; },
};
</script>
