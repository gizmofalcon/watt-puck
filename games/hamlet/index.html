<style>

</style>

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { MarchingCubes } from "three/addons/objects/MarchingCubes.js";
import { mergeGeometries, mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

// Hamlet: a small village in a clearing. Gather food, wood and gold, build, keep clear of the wolves,
// and advance the village to a new age.
//
// The puck plays it through Watt on this Mac: the page joins Watt's local bridge as a game and asks
// for the "panel" face, with what the selected villager or building can do as slots round the puck's
// rim. A swipe picks the next one (the map pans to it), turning the puck moves round the slots, a tap
// does the lit one. Holding on a building lets you point the puck at where it goes. A mouse and keys
// play it too, and the small puck in the corner works as a controller of its own.
//
// It looks like a little clay model on a table, drawn in 3D with three.js: the painted clearing, and
// on it clay trees, buildings, people and wolves in a low sun, with soft shadows.

const MAP_W = 3000, MAP_H = 2000;
const VIEW_H = 900;                  // world units the screen is tall, at rest
const HOME = { x: 1500, y: 1000 };   // where the Town Centre stands
const SAFE_R = 380;                  // wolves keep out of the village
const BUILD_R = 520;                 // and buildings go up this close to the Town Centre
const CARRY = 10, GATHER = 0.7;      // a load, and how much of it is gathered a second
const SPEED = { villager: 70, militia: 76, flee: 74, prowl: 34, chase: 90 };
const HP = { villager: 25, militia: 45, wolf: 30 };
const BITE = 3, HIT = 6;             // a wolf's bite and a militia's blow: health a second
const AGGRO = 225, LEASH = 900, PROWL_R = 320;  // a wolf notices villagers this close, chases them this far from its den
const COST = { villager: { food: 50 }, militia: { food: 60, gold: 20 }, house: { wood: 30 }, barracks: { wood: 120 },
  advance: { food: 300, wood: 200, gold: 100 } };
const TIME = { villager: 11, militia: 13, advance: 20, house: 12, barracks: 20 };  // seconds to train, to advance, to build
const MAX = { house: 5, barracks: 1, queue: 5 };
const SIZE = { tc: { w: 132, d: 84, h: 30, roof: 30 }, house: { w: 58, d: 42, h: 18, roof: 15 }, barracks: { w: 104, d: 56, h: 22, roof: 0 } };
const AMOUNT = { wood: 100, food: 150, gold: 800 };
const TURN_STEP = 40;                // degrees of turning the puck per slot
const SWEEP_DEG = 40;                // pointing the puck this far moves a new building across the screen
const STEP = 1 / 60;
const TAU = Math.PI * 2;
const BRIDGE = "ws://127.0.0.1:47824";

const cv = document.getElementById("map");
const ctx = cv.getContext("2d");
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
function seeded(a) {
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------------------------------------------------------- the clearing

// A river down the west side, with a bridge and a ford; woods, berries and a seam of gold round the
// village; a wolf den at three of the edges. The same clearing every game, so times compare.
const riverX = (y) => 600 + 60 * Math.sin(y * 0.0024 + 0.4) + 22 * Math.sin(y * 0.0071 + 1.3);
const riverW = (y) => 30 + 5 * Math.sin(y * 0.004 + 2);   // half its width
const CROSSINGS = [{ y: 990 }, { y: 1690 }];               // the bridge, the stepping stones
const side = (x, y) => (x < riverX(y) ? -1 : 1);
const inWater = (x, y, pad = 0) => Math.abs(x - riverX(y)) < riverW(y) + pad;
const onCrossing = (x, y) => CROSSINGS.some((c) => Math.abs(y - c.y) < 20 && Math.abs(x - riverX(c.y)) < riverW(c.y) + 30);

const PLACES = [
  { type: "wood", name: "in the grove", x: 1120, y: 680, r: 130, n: 11 },
  { type: "wood", name: "near the river", strip: [360, 1640], n: 26 },
  { type: "wood", name: "in the north woods", x: 1780, y: 250, r: 240, n: 20 },
  { type: "wood", name: "in the south woods", x: 2480, y: 1670, r: 250, n: 20 },
  { type: "wood", name: "over the river", west: true, n: 34 },
  { type: "food", name: "by the village", x: 1840, y: 1210, r: 74, n: 6 },
  { type: "food", name: "in the east", x: 2240, y: 640, r: 84, n: 6 },
  { type: "food", name: "over the river", x: 330, y: 1380, r: 80, n: 5 },
  { type: "gold", name: "at the seam", x: 2190, y: 1260, n: 1 },
  { type: "wood", name: "", lone: true, n: 16 },
];
const ROCKS = [[1150, 1520, 22], [1188, 1500, 14], [1118, 1484, 12], [1214, 1542, 10], [1088, 1534, 9], [2080, 160, 18], [2112, 188, 11],
  [2600, 420, 16], [2630, 442, 9], [880, 1770, 15], [905, 1792, 9], [2860, 1700, 14], [1640, 1668, 12], [1664, 1684, 7], [400, 620, 16], [430, 640, 9]];
const DENS = [{ x: 2600, y: 1240 }, { x: 1320, y: 110 }, { x: 2170, y: 1915 }];  // east (by the gold), north, south
const PATHS = [[1430, 992, 700, 990, 1060, 1010], [1560, 1040, 1820, 1190, 1700, 1140], [1566, 1010, 2140, 1240, 1880, 1060],
  [1450, 958, 1150, 720, 1260, 860], [1520, 958, 1700, 440, 1640, 700]];
const PATROL = Array.from({ length: 8 }, (_, i) => ({ x: HOME.x + Math.cos((i / 8) * TAU) * 600, y: HOME.y + Math.sin((i / 8) * TAU) * 430 }));

function blob(R, n, r, squash = 0.72) {
  return Array.from({ length: n }, (_, i) => { const a = (i / n) * TAU, k = r * (0.82 + R() * 0.3); return [Math.cos(a) * k, Math.sin(a) * k * squash]; });
}

function makeWorld() {
  const R = seeded(1701);
  for (const [x, y, r] of ROCKS) G.rocks.push({ t: "rock", x, y, r, pts: blob(R, 7, r) });
  const free = (x, y, r, gap) => {
    if (x < 50 || y < 50 || x > MAP_W - 50 || y > MAP_H - 50) return false;
    if (Math.abs(x - riverX(y)) < riverW(y) + r + 28) return false;
    if (Math.hypot(x - HOME.x, y - HOME.y) < 300) return false;
    if (CROSSINGS.some((c) => Math.abs(y - c.y) < 60 && Math.abs(x - riverX(c.y)) < 170)) return false;  // the crossings stay clear
    if (Math.abs(y - 990) < 48 && x > riverX(990) && x < HOME.x) return false;                          // and the road to the bridge
    for (const o of G.res) if (Math.hypot(o.x - x, o.y - y) < o.r + r + gap) return false;
    for (const o of G.rocks) if (Math.hypot(o.x - x, o.y - y) < o.r + r + gap) return false;
    for (const d of DENS) if (Math.hypot(d.x - x, d.y - y) < 60) return false;
    return true;
  };
  PLACES.forEach((pl, i) => {
    G.places.push({ name: pl.name, type: pl.type, left: 0 });
    if (pl.type === "gold") { addRes("seam", "gold", pl.x, pl.y, 36, i, R); return; }
    for (let k = 0, tries = 0; k < pl.n && tries < 5000; tries++) {
      let x, y;
      if (pl.strip) { y = pl.strip[0] + R() * (pl.strip[1] - pl.strip[0]); x = riverX(y) + riverW(y) + 62 + R() * 220; }
      else if (pl.west) { y = 70 + R() * (MAP_H - 140); x = 60 + R() * Math.max(0, riverX(y) - riverW(y) - 130); }
      else if (pl.lone) { x = 120 + R() * (MAP_W - 240); y = 100 + R() * (MAP_H - 200); }
      else { const a = R() * TAU, d = Math.sqrt(R()) * pl.r; x = pl.x + Math.cos(a) * d; y = pl.y + Math.sin(a) * d * 0.8; }
      const r = pl.type === "wood" ? 13 + R() * 7 : 10;
      if (pl.lone && (side(x, y) < 0 || Math.hypot(x - HOME.x, y - HOME.y) < 430)) continue;
      if (!free(x, y, r, pl.lone ? 70 : pl.type === "wood" ? 10 : 12)) continue;
      addRes(pl.type === "wood" ? "tree" : "bush", pl.type, x, y, r, i, R);
      k++;
    }
  });
}

function addRes(t, type, x, y, r, place, R) {
  const n = { t, id: G.id++, type, x, y, r, amt: AMOUNT[type], max: AMOUNT[type], place, hit: -9 };
  if (t === "tree") { n.pine = R() < 0.35; n.tone = ["#18221c", "#1b261f", "#1d2821", "#172019"][Math.floor(R() * 4)]; }
  if (t === "bush") n.dots = Array.from({ length: 8 }, () => [(R() - 0.5) * 15, -3 - R() * 11]);
  if (t === "seam") {

// ---------------------------------------------------------------- the game

let G = null;                 // the village, the wolves, what's left in the woods
let rnd = Math.random;        // the wolves' wandering; the clearing itself comes from a fixed seed

function newGame() {
  G = { t: 0, stock: { food: 150, wood: 80, gold: 0 }, units: [], wolves: [], blds: [], res: [], rocks: [], places: [], events: [],
    id: 1, n: { villager: 0, militia: 0, house: 0, barracks: 0 }, tc: null, advancing: false, won: false, wonAt: 0, lost: false, checkAt: 1,
    stats: { lost: 0, wolves: 0 } };
  makeWorld();
  G.tc = addBuilding("tc", HOME.x, HOME.y, true);
  for (const [dx, dy] of [[-46, 74], [0, 84], [46, 74]]) addUnit("villager", HOME.x + dx, HOME.y + dy);
  for (const d of DENS) G.wolves.push({ t: "wolf", id: G.id++, x: d.x, y: d.y, hp: HP.wolf, max: HP.wolf, den: d, st: "prowl", tx: d.x, ty: d.y,

function addBuilding(kind, x, y, done) {

  const u = { t: "unit", id: G.id++, kind, n: ++G.n[kind], x, y, hp: HP[kind], max: HP[kind], st: "idle", task: null, order: "guard",
    carry: { type: null, amt: 0 }, frac: 0, res: null, bld: null, after: null, gx: x, gy: y, foe: null, wp: 0,

function step(dt) {

  for (const w of G.wolves) wolfStep(w, dt);

function gone(u) {
  G.stats.lost++;

function trainStep(b, dt) {
  if (!b.done || !b.queue.length) return;
  const job = b.queue[0];

  b.jt += dt;
  if (b.jt < TIME[job]) return;

  b.jt = 0;

// Villagers: walk to the nearest of what they were told to gather, gather a load, carry it home, again
function villagerStep(v, dt) {

      if (!r || r.amt <= 0) { seek(v); break; }
      if (walk(v, v.gx, v.gy, SPEED.villager, dt, 6, r.t === "seam" ? r : null)) { v.st = "work"; v.dir = r.x < v.x ? -1 : 1; }
      break;
    }
    case "work": {
      const r = v.res;
      if (!r || r.amt <= 0) { seek(v); break; }
      v.moving = false;
      r.hit = G.t;
      v.frac += GATHER * dt;
      while (v.frac >= 1 && r.amt > 0 && v.carry.amt < CARRY) {
        v.frac -= 1;
        r.amt--;
        v.carry.amt++;
        v.carry.type = r.type;
        const p = G.places[r.place];
        if (--p.left === 0 && p.name) emit("out", { p });
      }
      if (r.amt <= 0) emit("gone", { r });
      if (v.carry.amt >= CARRY) { v.st = "home"; v.frac = 0; }

    case "home":

      break;

      break;
    }
    case "build": {
      const b = v.bld;
      if (!b || b.done) { resume(v); break; }
      v.moving = false;
      v.dir = b.x < v.x ? -1 : 1;
      b.prog = Math.min(1, b.prog + dt / TIME[b.kind]);
      if (b.prog >= 1) finish(b);

      break;

      v.moving = false;

function seek(v) {

  if (v.carry.amt && (v.carry.type !== task || v.carry.amt >= CARRY)) { v.st = "home"; return; }

// Militia: go after wolves when told, or stand guard by the Town Centre, or walk a ring round the village

    const w = m.foe;
    if ((m.order === "guard" && dist(w, HOME) > 780) || (m.order === "patrol" && dist(w, m) > 460)) m.foe = null;
    else {
      if (dist(m, w) > 18) { walk(m, w.x, w.y, SPEED.militia, dt, 16); m.fight = false; }

        m.fight = true;

function wolfStep(w, dt) {

// ---------------------------------------------------------------- walking

// Toward (gx, gy): over the river by the nearer crossing, round buildings and rocks. True once within `near`.
function walk(u, gx, gy, speed, dt, near = 4, ignore = null) {

    const s = side(gx, gy);

    const ox = x - u.x, oy = y - u.y, ahead = ox * dx + oy * dy;
    if (ahead < 0 || ahead > Math.min(r + 60, reach + r)) return;
    const lat = -ox * dy + oy * dx, R = r + 9;
    if (Math.abs(lat) >= R) return;
    const k = ((R - Math.abs(lat)) / R) * 1.8, s = lat > 0 ? -1 : 1;
    ax += -dy * s * k;
    ay += dx * s * k;
  };
  for (const r of G.rocks) one(r.x, r.y, r.r, r);
  for (const r of G.res) if (r.t === "seam") one(r.x, r.y, r.r, r);
  const L = Math.hypot(ax, ay) || 1;
  return [ax / L, ay / L];
}

// Out of the water (unless on a crossing), out of buildings and rocks, inside the map
function settle(u, ox, oy) {
  if (inWater(u.x, u.y, 5)) {
    const c = CROSSINGS.find((k) => Math.abs(u.y - k.y) < 44);
    if (c) { if (Math.abs(u.y - c.y) > 20) u.y = c.y + Math.sign(u.y - c.y) * 20; }
    else u.x = riverX(u.y) + side(ox, oy) * (riverW(u.y) + 5.5);
  }
  for (const b of G.blds) {  // 5 clear of every wall, with round corners, so people slide round them
    const s = SIZE[b.kind], hw = s.w / 2, hd = s.d / 2;
    const cx = clamp(u.x, b.x - hw, b.x + hw), cy = clamp(u.y, b.y - hd, b.y + hd), dx = u.x - cx, dy = u.y - cy, d = Math.hypot(dx, dy);
    if (d >= 5) continue;
    if (d > 1e-6) { u.x = cx + (dx / d) * 5; u.y = cy + (dy / d) * 5; }
    else if (hw - Math.abs(u.x - b.x) < hd - Math.abs(u.y - b.y)) u.x = b.x + (u.x < b.x ? -hw - 5 : hw + 5);
    else u.y = b.y + (u.y < b.y ? -hd - 5 : hd + 5);
  }
  const round = (r, R) => {
    const dx = u.x - r.x, dy = u.y - r.y, d = Math.hypot(dx, dy);
    if (d < R && d > 0.01) { u.x = r.x + (dx / d) * R; u.y = r.y + (dy / d) * R; }
  };
  for (const r of G.rocks) round(r, r.r + 5);
  for (const r of G.res) if (r.t === "seam") round(r, r.r + 4);
  u.x = clamp(u.x, 8, MAP_W - 8);
  u.y = clamp(u.y, 8, MAP_H - 8);
}

// People keep a little apart; two on the move only a little, so they can pass in a lane
function separate() {
  const a = G.units;
  for (let i = 0; i < a.length; i++) {
    for (let j = i + 1; j < a.length; j++) {
      const p = a[i], q = a[j], dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy;
      if (d2 >= 196 || d2 < 1e-4) continue;
      const d = Math.sqrt(d2), k = (14 - d) * (p.moving && q.moving ? 0.06 : 0.25), ux = dx / d, uy = dy / d;
      const px = p.x, py = p.y, qx = q.x, qy = q.y;
      p.x -= ux * k; p.y -= uy * k; q.x += ux * k; q.y += uy * k;
      settle(p, px, py);
      settle(q, qx, qy);
    }
  }
}

// ---------------------------------------------------------------- what each thing can do

const ACTIONS = {
  villager: [{ id: "wood", name: "Chop wood" }, { id: "food", name: "Gather food" }, { id: "gold", name: "Mine gold" },
    { id: "house", name: "Build house", cost: COST.house, build: "house" }, { id: "barracks", name: "Build barracks", cost: COST.barracks, build: "barracks" },
    { id: "help", name: "Help build" }],
  militia: [{ id: "hunt", name: "Hunt wolves" }, { id: "guard", name: "Guard" }, { id: "patrol", name: "Patrol" }],
  tc: [{ id: "villager", name: "Train villager", cost: COST.villager }, { id: "advance", name: "Advance", cost: COST.advance }],
  barracks: [{ id: "militia", name: "Train militia", cost: COST.militia }],
  house: [],
};
const actionsOf = (e) => (e.t === "bld" && !e.done ? [] : ACTIONS[e.kind]);

// Why it can't be done now, or "" if it can
function whyNot(e, a, at) {
  if (a.build) {
    if (nBuilt(a.build) >= MAX[a.build]) return a.build === "house" ? "Five is the most" : "Already have one";
    if (at) { const w = canPlace(a.build, at.x, at.y); if (w) return w; }
  }
  if (a.id === "villager" || a.id === "militia") {
    if (e.queue.length >= MAX.queue) return "Five in line already";
    if (pop() + queued() >= cap()) return cap() >= 30 ? "The village is full" : "No room: build a house";
  }
  if (a.id === "advance" && G.advancing) return "Already advancing";
  if (a.id === "help" && !nearestSite(e)) return "Nothing to build";
  if (a.id === "hunt" && !G.wolves.length) return "No wolves left";
  if ((a.id === "wood" || a.id === "food" || a.id === "gold") && !G.res.some((r) => r.type === a.id && r.amt > 0)) return `No ${a.id} left`;
  if (a.cost) for (const k of ["food", "wood", "gold"]) if (a.cost[k] > G.stock[k]) return `Need ${a.cost[k] - G.stock[k]} more ${k}`;
  return "";
}

function perform(e, a, at) {
  const why = whyNot(e, a, at);
  if (why) return why;
  if (a.build) {
    const spot = at || autoSpot(a.build, e);
    if (!spot) return "No room near home";
    pay(a.cost);
    sendToBuild(e, addBuilding(a.build, spot.x, spot.y, false));
  } else if (a.id === "help") sendToBuild(e, nearestSite(e));
  else if (e.kind === "villager") setTask(e, a.id);
  else if (e.kind === "militia") setOrder(e, a.id);
  else {
    pay(a.cost);
    e.queue.push(a.id);
    if (a.id === "advance") G.advancing = true;
  }
  return "";
}
function pay(cost) { for (const k in cost) G.stock[k] -= cost[k]; }

// Where a building may go: on open ground, near home, clear of the river, trees, bushes and rocks,
// with room to walk round it
function canPlace(kind, x, y) {
  const s = SIZE[kind], hw = s.w / 2, hd = s.d / 2, lane = 40;
  if (x - hw < 40 || x + hw > MAP_W - 40 || y - hd < 60 || y + hd > MAP_H - 40) return "No room here";
  if (Math.hypot(x - HOME.x, y - HOME.y) > BUILD_R) return "Too far from home";
  for (const yy of [y - hd, y, y + hd]) if (Math.abs(x - riverX(yy)) < riverW(yy) + hw + lane) return "No room here";
  for (const b of G.blds) {
    const t = SIZE[b.kind];
    if (Math.abs(x - b.x) < hw + t.w / 2 + lane && Math.abs(y - b.y) < hd + t.d / 2 + lane) return "No room here";
  }
  const hits = (cx, cy, r) => Math.hypot(Math.max(0, Math.abs(cx - x) - hw), Math.max(0, Math.abs(cy - y) - hd)) < r;
  for (const r of G.res) if ((r.amt > 0 || r.t === "seam") && hits(r.x, r.y, r.t === "tree" ? 14 : r.t === "seam" ? r.r + lane : r.r + 6)) return "No room here";
  for (const r of G.rocks) if (hits(r.x, r.y, r.r + lane)) return "No room here";
  for (const u of G.units) if (u.st === "build" || u.st === "work") if (hits(u.x, u.y, 4)) return "No room here";
  return "";
}

// A free spot near the Town Centre, leaning towards the builder
function autoSpot(kind, v) {
  let best = null, bs = Infinity;
  for (let r = 150; r <= BUILD_R; r += 30) {
    const n = Math.max(10, Math.round(r / 20));
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + r * 0.01, x = HOME.x + Math.cos(a) * r * 1.12, y = HOME.y + Math.sin(a) * r * 0.86;
      if (canPlace(kind, x, y)) continue;
      const sc = r + 0.25 * Math.hypot(x - v.x, y - v.y);
      if (sc < bs) { bs = sc; best = { x, y }; }
    }
  }
  return best;
}

// ---------------------------------------------------------------- picking, choosing, doing

let state = "title";          // title, play, ending (the new age, a moment before the panel), won, lost
let stateAt = 0, now = 0, lastInput = "mouse", best = 0, prevBest = 0, newBest = false;
let selId = 0, selAt = 0;     // what's picked, and since when
let placing = null;           // choosing where a building goes
const NEVER = -1e9;           // a time long before the page opened
const pk = { s: "", sn: 0, flash: "", flashAt: NEVER, okAt: NEVER, turn: 0, turnAt: 0, inputAt: NEVER };
try { best = +localStorage.getItem("hamlet.best") || 0; } catch { best = 0; }

// One ring of everything that can be picked: the Town Centre, villagers, militia, then buildings
const roster = () => [G.tc, ...G.units.filter((u) => u.kind === "villager"), ...G.units.filter((u) => u.kind === "militia"),
  ...G.blds.filter((b) => b !== G.tc)];
const kindOf = (e) => (e.kind === "villager" ? 0 : e.kind === "militia" ? 1 : 2);
function selected() { return G.units.find((u) => u.id === selId) || G.blds.find((b) => b.id === selId) || G.tc; }
function nameOf(e) {
  if (e.kind === "tc") return "Town Centre";
  if (e.kind === "barracks") return "Barracks";
  return `${e.kind[0].toUpperCase()}${e.kind.slice(1)} ${e.n}`;
}
function hlOf(e) { const n = actionsOf(e).length; return n ? (((e.hl || 0) % n) + n) % n : 0; }

function pick(e, quiet) {
  if (!e) return;
  if (e.id !== selId) {
    selId = e.id;
    selAt = now;
    pk.turn = 0;
    pk.flash = "";
    // a villager or militia shows what it's doing now; a building, what you chose last
    const acts = actionsOf(e);
    const i = e.kind === "villager" ? acts.findIndex((a) => a.id === (e.task === "build" ? "help" : e.task))
      : e.kind === "militia" ? acts.findIndex((a) => a.id === e.order) : -1;
    if (i >= 0) e.hl = i;
  }
  cam.free = false;
  flyTo();
  if (!quiet) { sound("select"); puckSound("tock"); }
}
function cycle(d) {
  const r = roster(), i = Math.max(0, r.findIndex((e) => e.id === selId));
  pick(r[(i + d + r.length) % r.length]);
}
// Up and down skip to the next kind: villagers (idle ones first), militia, buildings
function jumpKind(d) {
  const r = roster(), k = kindOf(selected());
  for (let j = 1; j <= 2; j++) {
    const want = (k + d * j + 3) % 3, list = r.filter((e) => kindOf(e) === want);
    if (list.length) { pick(want === 0 ? list.find((v) => v.st === "idle") || list[0] : list[0]); return; }
  }
}
function jumpTo(k) {
  const list = roster().filter((e) => kindOf(e) === k);
  if (!list.length) { no(k === 1 ? "No militia yet" : "No one yet"); return; }
  let e = list[0];
  if (k === 0) {
    const idle = list.filter((v) => v.st === "idle");
    if (idle.length) e = idle[(idle.findIndex((v) => v.id === selId) + 1) % idle.length];
  }
  pick(e);
}
function moveHl(d) {
  const e = selected(), n = actionsOf(e).length;
  if (n < 2) return;
  e.hl = (hlOf(e) + d + n) % n;
  pk.flash = "";
  sound("step");
  puckSound("click");
}
function turn(deg) {
  pk.turn += deg;
  pk.turnAt = performance.now();
  while (pk.turn >= TURN_STEP) { pk.turn -= TURN_STEP; moveHl(1); }
  while (pk.turn <= -TURN_STEP) { pk.turn += TURN_STEP; moveHl(-1); }
}

// A tap on the puck, Enter, a click on the lit slot
function press() {
  if (state !== "play") {
    if (state === "title" || ((state === "won" || state === "lost") && performance.now() - stateAt > 800)) start();
    return;
  }
  if (placing) { place(); return; }
  const e = selected(), acts = actionsOf(e);
  if (!acts.length) { no(e.t === "bld" && !e.done ? "Still rising" : "A home: nothing to do"); return; }
  const a = acts[hlOf(e)], why = perform(e, a);
  if (why) no(why);
  else yes(a.build ? "place" : "ok");
}
// A hold: choose where a building goes, or bring the view back to what's picked
function hold() {
  if (state !== "play") return;
  if (placing) { cancelPlacing(); return; }
  const e = selected(), a = actionsOf(e)[hlOf(e)];
  if (a && a.build) {
    const why = whyNot(e, a);
    if (why) { no(why); return; }
    const spot = autoSpot(a.build, e) || { x: HOME.x, y: HOME.y + 160 };
    placing = { kind: a.build, by: e.id, a, x: spot.x, y: spot.y, lock: true };
    cam.free = false;
    flyTo();
    sound("select");
    puckSound("tick");
    return;
  }
  cam.free = false;
  flyTo();
  puckSound("tock");
}
function place() {
  const p = placing, v = G.units.find((u) => u.id === p.by);
  if (!v) { cancelPlacing(); return; }
  const fit = canPlace(p.kind, p.x, p.y);
  if (fit) { no(fit); return; }
  placing = null;
  const why = perform(v, p.a, { x: p.x, y: p.y });
  if (why) no(why);
  else yes("place");
  cam.free = false;
  flyTo();
}
function cancelPlacing() {
  placing = null;
  cam.free = false;
  flyTo();
  sound("step");
  puckSound("tock");
}
function no(why) {
  pk.flash = why;
  pk.flashAt = performance.now();
  sound("no");
  puckSound("no");
  const m = /more (food|wood|gold)/.exec(why);
  if (m) shortAt[m[1]] = performance.now();
}
function yes(kind) {
  pk.okAt = performance.now();
  pk.flash = "";
  sound(kind);
  puckSound("ok");
}
const puckSound = (s) => { pk.s = s; pk.sn++; };

// ---------------------------------------------------------------- what the puck shows

function costText(c) { return ["food", "wood", "gold"].filter((k) => c[k]).map((k) => `${c[k]} ${k}`).join(", "); }

function doing(e) {
  if (e.t === "bld") {
    if (!e.done) {
      const on = G.units.some((u) => u.bld === e && u.st === "build");
      return on ? `Rising, ${Math.floor(e.prog * 100)}%` : `${Math.floor(e.prog * 100)}%, needs a builder`;
    }
    if (e.queue.length) {
      const j = e.queue[0], left = Math.max(1, Math.ceil(TIME[j] - e.jt));
      return j === "advance" ? `Advancing, ${left} s left` : `Training, ${left} s left`;
    }
    return e.kind === "barracks" ? "Ready to train" : "Home for 5";
  }
  if (e.kind === "militia") return e.foe ? "Fighting a wolf" : { hunt: "Hunting wolves", guard: "Guarding home", patrol: "On patrol" }[e.order];
  const where = { wood: "the woods", food: "the berries", gold: "the gold" };
  switch (e.st) {
    case "go": return `Going to ${where[e.task] || "work"}`;
    case "work": return `${{ wood: "Chopping", food: "Picking", gold: "Mining" }[e.task] || "Gathering"}, ${e.carry.amt} of ${CARRY}`;
    case "home": return `Taking ${e.carry.amt} ${e.carry.type} home`;
    case "tobuild": return "Going to build";
    case "build": return e.bld ? `Building, ${Math.floor(e.bld.prog * 100)}%` : "Building";
    case "flee": return "Running home";
    case "rest": return "Resting";
    default: return "Idle";
  }
}
function subFor(e, a) {
  const why = whyNot(e, a);
  if (why) return why;
  if (a.id === "advance") return "20 s to a new age";
  return a.cost ? costText(a.cost) : doing(e);
}

// The "panel" face: the picked thing's name, its actions round the rim, the lit one in the middle
function faceNow() {
  const P = {};
  let label = "Hamlet";
  if (state === "title") { P.msg = "Start"; P.sub = "Tap to begin"; }
  else if (state === "ending" || state === "won") { P.msg = "New age"; P.ok = 1; P.sub = `In ${fmt(G.wonAt)}`; }
  else if (state === "lost") { P.msg = "Empty"; P.sub = "Tap to try again"; }
  else {
    const e = selected();
    label = nameOf(e);
    if (placing) {
      const why = canPlace(placing.kind, placing.x, placing.y);
      P.msg = "Where?";
      P.sub = why || "Tap to build here";
      P.ok = why ? 0 : 1;
      P.aim = 1;
    } else {
      const acts = actionsOf(e), i = hlOf(e), a = acts[i];
      if (acts.length > 1) { P.seg = acts.length; P.idx = i; }
      if (a) { P.msg = a.name; P.sub = subFor(e, a); }
      else if (e.t === "bld" && !e.done) { P.msg = "Rising"; P.sub = doing(e); }
      else { P.msg = "Home for 5"; P.sub = `${pop()} of ${cap()} people`; }
      if (e.t === "bld" && acts.length < 2) {
        const k = !e.done ? e.prog : e.queue.length ? e.jt / TIME[e.queue[0]] : -1;
        if (k >= 0) { P.p = Math.round(k * 50) / 50; P.on = 1; }
      }
      if (e.t === "bld" && e.queue.length) { P.dn = Math.min(10, e.queue.length); P.dk = 1; }
      if (pk.flash && now - pk.flashAt < 1800) P.sub = pk.flash;
      if (now - pk.okAt < 450) P.ok = 1;
    }
  }
  if (pk.sn) { P.s = pk.s; P.sn = pk.sn; }
  return { face: "panel", label, params: P };
}

// ---------------------------------------------------------------- the camera

// The clearing is a diorama on a table, seen in perspective from above and in front: a camera
// cam.d world units from the point it looks at (cam.x, cam.y), EL above the ground. Playing, it
// sits NEAR; on the title it stands back, FAR, and the whole clearing fits the screen.
const EL = (52 * Math.PI) / 180, SIN_E = Math.sin(EL), COS_E = Math.cos(EL);
const NEAR = 2600, FAR = 4400, REST = 1.4;   // REST: the zoom playing
const cam = { x: HOME.x, y: HOME.y, z: 1, d: FAR, free: false, flight: null };
let W = 0, H = 0, DPR = 1, FOC = 1;
const baseScale = () => clamp(H / VIEW_H, 0.6, 1.5);
const scaleOf = () => baseScale() * cam.z;   // screen pixels to a world unit, where the camera looks
function lens() { FOC = scaleOf() * cam.d; }

// Where a point of the world falls on the screen (z is its height), and how many pixels a world
// unit is there; and back, the point on the ground under a point of the screen
const P = { x: 0, y: 0, k: 1 };
function proj(x, y, z = 0, o = P) {
  const dy = y - cam.y, k = FOC / Math.max(60, cam.d - dy * COS_E - z * SIN_E);
  o.x = W / 2 + (x - cam.x) * k;
  o.y = H / 2 + (dy * SIN_E - z * COS_E) * k;
  o.k = k;
  return o;
}
function toWorld(sx, sy) {
  const a = (sy - H / 2) / FOC, den = SIN_E + a * COS_E;
  const dy = den > 0.05 ? (a * cam.d) / den : -1e5;
  return { x: cam.x + ((sx - W / 2) * (cam.d - dy * COS_E)) / FOC, y: cam.y + dy };
}
function onScreen(e, m = 40) {
  const p = proj(e.x, e.y);
  return p.x > -m && p.x < W + m && p.y > -m && p.y < H + m;
}
// The title's view: the whole clearing, on the table
function overview() {
  return Math.min((0.8 * W) / MAP_W, (0.6 * H) / (MAP_H * SIN_E)) / baseScale();
}

function camTarget() {
  if (placing) {
    if (placing.lock) return { x: placing.x, y: placing.y };
    // the view follows the building once it nears the edge
    const s = scaleOf(), mx = (W / s) * 0.3, my = (H / s) * 0.28;
    return { x: clamp(cam.x, placing.x - mx, placing.x + mx), y: clamp(cam.y, placing.y - my, placing.y + my) };
  }
  const e = selected();
  return e.t === "bld" ? { x: e.x, y: e.y - SIZE[e.kind].h * 0.6 } : { x: e.x, y: e.y - 12 };
}
// A pan to what's picked; going far, the view pulls back a little on the way
function flyTo() {
  const t = camTarget(), d = Math.hypot(t.x - cam.x, t.y - cam.y);
  if (calm) { cam.x = t.x; cam.y = t.y; cam.z = REST; cam.d = NEAR; cam.flight = null; return; }
  if (d < 2 && Math.abs(cam.z - REST) < 0.02) { cam.flight = null; return; }
  cam.flight = { x: cam.x, y: cam.y, z: cam.z, d: cam.d, t: 0, dur: clamp(0.4 + d / 2600 + (Math.abs(REST - cam.z) / REST) * 1.1, 0.4, 1.4),
    out: clamp((d - 260) / 2400, 0, 0.3) };
}
function camStep(dt) {
  if (state === "title") {
    const t = now / 1000;
    cam.x = MAP_W / 2 + (calm ? 0 : Math.sin(t * 0.05) * 40);
    cam.y = MAP_H / 2 + 30 + (calm ? 0 : Math.cos(t * 0.04) * 20);
    cam.z = overview();
    cam.d = FAR;
    lens();
    return;
  }
  const a = calm ? 1 : 1 - Math.exp(-dt * 6);
  if (cam.free && !placing) { cam.z += (REST - cam.z) * a; cam.d += (NEAR - cam.d) * a; clampCam(); return; }
  const t = camTarget();
  if (cam.flight) {
    const f = cam.flight;
    f.t += dt;
    const k = clamp(f.t / f.dur, 0, 1), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    cam.x = f.x + (t.x - f.x) * e;
    cam.y = f.y + (t.y - f.y) * e;
    cam.z = (f.z + (REST - f.z) * e) * (1 - f.out * Math.sin(Math.PI * k));
    cam.d = f.d + (NEAR - f.d) * e;
    if (k >= 1) { cam.flight = null; if (placing) placing.lock = false; }
  } else {
    cam.x += (t.x - cam.x) * a;
    cam.y += (t.y - cam.y) * a;
    cam.z += (REST - cam.z) * a;
    cam.d += (NEAR - cam.d) * a;
    if (placing) placing.lock = false;
  }

}
// Keep the view on the table: a little of it past the clearing's edge may show, no more
function clampCam() {
  lens();

    const v = Math.floor(G.stock[k]);
    if (lastStock && v > lastStock[k] && state === "play") bump($("s-" + k));
    put(k, String(v));
    $("s-" + k).classList.toggle("short", t - shortAt[k] < 1200);
  }

  put("pop", String(pop()));

  put("clock", fmt(state === "won" || state === "ending" ? G.wonAt : state === "play" || state === "lost" ? G.t : 0));
  document.body.classList.toggle("playing", state === "play" || state === "ending");

    const flash = pk.flash && t - pk.flashAt < 1800;
    let act;
    if (placing) act = `<b>Where?</b> ${canPlace(placing.kind, placing.x, placing.y) || "Click to build here"}`;
    else if (flash) act = pk.flash;
    else if (a) act = `<b>${a.name}</b> ${a.cost ? costText(a.cost) : ""}`;
    else act = e.t === "bld" && !e.done ? "<b>Rising</b>" : `<b>Home for 5</b> ${pop()} of ${cap()} people`;

}

function hintText() {
  if (state !== "play") return "";
  const puck = lastInput === "puck";
  if (placing) return puck ? "Point the puck where it goes, then tap. Swipe to cancel." : "Click where it goes, or move it with the arrows and press Enter. Esc to cancel.";
  if (G.t < 14) return puck ? "Turn the puck to choose, tap to do it. Swipe for the next one." : "Up and down to choose, Enter to do it. E and Q for the next one.";
  const idle = G.units.filter((u) => u.kind === "villager" && u.st === "idle").length;
  if (idle && G.t > 30) return `${idle === 1 ? "A villager is" : idle + " villagers are"} idle.${puck ? "" : " Press 1 to find them."}`;
  return "";

// Toasts: what just happened; a click goes to it

  const box = $("toasts"), el = document.createElement("div");

  el.append(text);

    if (ev.k === "drop") {
      if (live && onScreen(G.tc, 0)) {
        fx.push({ k: "text", x: G.tc.x + (Math.random() - 0.5) * 50, y: G.tc.y - 64, s: `+${ev.amt} ${ev.type}`, at: now });
        sound("drop");
      }
      continue;
    }
    if (ev.k === "wolf") fx.push({ k: "puff", x: ev.x, y: ev.y, at: now });
    if (!live) continue;
    switch (ev.k) {
      case "attack": toast(`${nameOf(ev.u)} is under attack`, ev.u, true); sound("growl"); break;
      case "dead":
        toast(`${nameOf(ev.u)} was lost`, null, true);
        sound("lost");
        if (ev.u.id === selId) { const r = roster(); pick(r.find((e) => kindOf(e) === kindOf(ev.u)) || G.tc, true); }
        if (placing && placing.by === ev.u.id) placing = null;
        break;
      case "out": toast(ev.p.type === "gold" ? "The gold seam is empty" : `${ev.p.type === "wood" ? "Wood" : "Berries"} ran out ${ev.p.name}`); break;
      case "none": toast(`No ${ev.type === "food" ? "berries" : ev.type} left to gather`); break;
      case "trained": toast(`${nameOf(ev.u)} is ready`, ev.u); sound("trained"); break;
      case "built": toast(ev.b.kind === "barracks" ? "The barracks are built" : `${nameOf(ev.b)} is built`, ev.b); sound("built"); break;
      case "wolf": toast(ev.left ? `A wolf is down, ${ev.left} left` : "The last wolf is down"); sound("wolf"); break;
      case "advancing": toast("Advancing to a new age", G.tc, true); sound("begin"); break;
      case "age": break;
      case "lost": break;
    }
  }
  G.events.length = 0;
}

// Work sounds: the picked villager's, and now and then one in view
function workSounds() {
  if (state !== "play" || !audio) return;
  const sel = selected();
  for (const u of G.units) {
    if (u.kind !== "villager" || u.moving || (u.st !== "work" && u.st !== "build")) continue;
    const beat = Math.floor((G.t + u.id * 0.37) / 0.85);
    if (u.beat === beat) continue;
    u.beat = beat;
    const mine = u === sel;
    if (!mine && (now - workAt < 450 || !onScreen(u, 0))) continue;
    if (!mine) workAt = now;
    sound(u.st === "build" ? "hammer" : u.task === "wood" ? "chop" : u.task === "gold" ? "mine" : "pick", mine ? 1 : 0.35);
  }
}

const PANELS = {
  title: () => `<h1>Hamlet</h1>
    <p>Three villagers, a Town Centre and a clearing in the woods. Gather food, wood and gold, mind the wolves, and <b>advance to a new age.</b></p>
    <p class="how">${bridge.up ? "Swipe on the puck to pick a villager or a building, and the map goes to it. Turn the puck to choose what it does, tap to do it. On a building, hold, then point the puck where it goes."
      : "Tab, or Q and E, picks a villager or a building. Up and down, or the wheel, choose what it does, and Enter does it. Click to pick, drag to look around, and hold Enter to choose where a building goes."}</p>
    ${best ? `<p class="how">Best time ${fmt(best)}</p>` : ""}
    ${worldOk ? "" : `<p class="how">This browser has WebGL turned off, and Hamlet needs it to draw the clearing.</p>`}
    <div class="go"><button class="btn" type="button" data-go>Start</button><span class="or">${bridge.up ? "or tap the puck" : "or press Enter"}</span></div>`,
  won: () => {
    const v = G.units.filter((u) => u.kind === "villager").length, h = G.blds.filter((b) => b.kind === "house" && b.done).length;
    return `<h1>A new age</h1>
    <p>Your hamlet advanced in ${fmt(G.wonAt)}${newBest ? ", a new best." : prevBest ? `. Best ${fmt(prevBest)}.` : "."}</p>
    <p class="how">${v} villager${v === 1 ? "" : "s"}, ${h} house${h === 1 ? "" : "s"}${G.stats.wolves ? `, ${G.stats.wolves} wol${G.stats.wolves === 1 ? "f" : "ves"} down` : ""}${G.stats.lost ? `, ${G.stats.lost} lost to wolves` : ""}.</p>
    <div class="go"><button class="btn" type="button" data-go>Play again</button><a class="btn quiet" href="../">More games</a></div>`;
  },
  lost: () => `<h1>The hamlet is empty</h1>
    <p>No villagers are left, and there isn't the food for another. Keep them clear of the wolves, or send militia first.</p>
    <div class="go"><button class="btn" type="button" data-go>Try again</button><a class="btn quiet" href="../">More games</a></div>`,
};
function showPanel() {
  const make = PANELS[state];
  $("panel").classList.toggle("show", !!make);
  $("panel").inert = !make;  // hidden, its buttons can't be pressed: space would start the game again
  if (!make) { document.activeElement?.blur?.(); return; }
  $("card").innerHTML = make();
  $("card").querySelector("[data-go]")?.addEventListener("click", (e) => { e.stopPropagation(); unlockSound(); start(); });
}

// ---------------------------------------------------------------- playing

function start() {
  newGame();
  state = "play";
  stateAt = now;
  placing = null;
  pk.turn = 0;
  pk.flash = "";
  selId = 0;
  pick(G.units[0], true);
  showPanel();
  miniDirty = true;
  $("toasts").replaceChildren();
  lastStock = null;
  sound("select");
  count("game_start", { game: "hamlet", input: lastInput });
}
function beginEnding() {
  state = "ending";
  stateAt = now;
  placing = null;
  pick(G.tc, true);
  sound("age");
  puckSound("ok");
  toast("A new age", G.tc, true);
}
function win() {
  state = "won";
  stateAt = now;
  prevBest = best;
  newBest = !!prevBest && G.wonAt < prevBest;
  if (!prevBest || G.wonAt < prevBest) { best = G.wonAt; try { localStorage.setItem("hamlet.best", String(best)); } catch {} }
  showPanel();
  count("game_end", { game: "hamlet", result: "won", seconds: Math.round(G.wonAt) });
}
function lose() {
  state = "lost";
  stateAt = now;
  placing = null;
  showPanel();
  count("game_end", { game: "hamlet", result: "lost", seconds: Math.round(G.t) });
}

// The title: the same clearing behind it, three villagers at work
function backdrop() {
  newGame();
  G.units.forEach((v, i) => setTask(v, ["food", "wood", "wood"][i]));
}

// ---------------------------------------------------------------- the puck, through Watt

const bridge = { ws: null, up: false, sent: "", sentAt: 0, retry: 3000, heard: NEVER };

function connect() {
  let ws;
  try { ws = new WebSocket(BRIDGE); } catch { setTimeout(connect, bridge.retry); return; }
  ws.onopen = () => {
    bridge.ws = ws;
    bridge.up = true;
    bridge.retry = 3000;
    bridge.sent = "";
    send({ type: "hello", kind: "game", name: "Hamlet" });
    presence();
    if (state === "title") showPanel();
  };
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    const t = performance.now();
    if (m.type === "aim") { bridge.heard = t; aimMove(m.dx, m.dy); }
    else if (m.type === "input") {
      bridge.heard = t;
      pk.inputAt = t;
      lastInput = "puck";
      if (m.input === "tap") press();
      else if (m.input === "hold") hold();
      else if (m.input === "swipe") swipe(m.value);
      else if (m.input === "turn" && typeof m.value === "number" && state === "play" && !placing) turn(m.value);
    }
  };
  ws.onclose = () => {
    const was = bridge.up;
    bridge.ws = null;
    bridge.up = false;
    if (was && state === "title") showPanel();
    setTimeout(connect, bridge.retry);
    bridge.retry = Math.min(bridge.retry * 1.5, 15000);  // Watt isn't open: ask less often
  };
}
function send(o) { if (bridge.ws && bridge.ws.readyState === 1) bridge.ws.send(JSON.stringify(o)); }

// Watt gives the puck to the page you're looking at
function presence() { send({ type: "presence", visible: !document.hidden, focused: document.hasFocus(), title: document.title }); }
addEventListener("focus", presence);
addEventListener("blur", presence);
document.addEventListener("visibilitychange", presence);
setInterval(presence, 2000);

function swipe(d) {
  if (state !== "play") return;
  if (placing) { cancelPlacing(); return; }
  if (d === "l") cycle(-1);
  else if (d === "r") cycle(1);
  else if (d === "d") jumpKind(1);
  else if (d === "u") jumpKind(-1);
}
// Pointing the puck moves the new building, as an air mouse moves a pointer
function aimMove(dx, dy) {
  if (!placing || state !== "play" || typeof dx !== "number" || typeof dy !== "number") return;
  const k = W / (SWEEP_DEG * 100) / scaleOf();
  placing.x = clamp(placing.x + dx * k, 40, MAP_W - 40);
  placing.y = clamp(placing.y + dy * k, 40, MAP_H - 40);
  placing.lock = false;
  lastInput = "puck";
}

// The face goes when it changes: quickly right after the puck is used, at most every 100 ms otherwise
function face(t) {
  const f = faceNow();
  lastFace = f;
  const s = JSON.stringify(f);
  if (s !== mirrorDrawn) { mirrorDrawn = s; drawMirror(f); }
  if (!bridge.up) return;
  const gap = t - pk.inputAt < 400 ? 40 : 100;
  if (s === bridge.sent || t - bridge.sentAt < gap) return;
  bridge.sent = s;
  bridge.sentAt = t;
  send(f);
}

function connState() {
  const puck = bridge.up && performance.now() - bridge.heard < 4000;
  $("conn").classList.toggle("puck", puck);
  put("connText", puck ? "Puck" : bridge.up ? "Watt is on: try the puck" : "Mouse");
}

// ---------------------------------------------------------------- mouse, touch, keys

let drag = null, wheelAcc = 0, wheelAt = 0;
cv.addEventListener("pointerdown", (e) => {
  unlockSound();
  if (state !== "play") return;
  drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false, touch: e.pointerType === "touch" };
  cv.setPointerCapture?.(e.pointerId);
});
cv.addEventListener("pointermove", (e) => {
  if (state !== "play") return;
  if (placing && e.pointerType === "mouse" && (!drag || !drag.moved)) {
    const w = toWorld(e.clientX, e.clientY);
    placing.x = w.x;
    placing.y = w.y;
    placing.lock = false;
    lastInput = "mouse";
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; document.body.classList.add("dragging"); }
  if (drag.moved) {
    const k = scaleOf();  // the ground slides under the pointer, foreshortened going back
    cam.x = drag.cx - dx / k;
    cam.y = drag.cy - dy / (k * SIN_E);
    cam.free = true;
    cam.flight = null;
    clampCam();
  }
});
cv.addEventListener("pointerup", (e) => {
  const d = drag;
  drag = null;
  document.body.classList.remove("dragging");
  if (!d || d.moved || state !== "play") return;
  lastInput = d.touch ? "touch" : "mouse";
  const w = toWorld(e.clientX, e.clientY);
  if (placing) { placing.x = w.x; placing.y = w.y; place(); return; }
  const hit = hitTest(e.clientX, e.clientY, d.touch ? 30 : 20);
  if (hit) pick(hit);
});
cv.addEventListener("pointercancel", () => { drag = null; document.body.classList.remove("dragging"); });
cv.addEventListener("contextmenu", (e) => { e.preventDefault(); if (placing) cancelPlacing(); });
cv.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (state !== "play" || placing) return;
  const t = performance.now();
  if (t - wheelAt > 400) wheelAcc = 0;
  wheelAcc += e.deltaMode ? e.deltaY * 30 : e.deltaY;
  if (Math.abs(wheelAcc) >= 50 && t - wheelAt > 90) { moveHl(Math.sign(wheelAcc)); wheelAcc = 0; wheelAt = t; lastInput = "mouse"; }
}, { passive: false });

// What's under a point of the screen: people by the middle of their bodies, then buildings, the
// nearest first
function hitTest(sx, sy, reach) {
  let best = null, bd = reach;
  const near = (e, up) => { const p = proj(e.x, e.y, e.z || 0), d = Math.hypot(p.x - sx, p.y - up * p.k - sy); if (d < bd) { bd = d; best = e; } };
  for (const u of G.units) near(u, 12 * FS_P);
  if (best) return best;
  for (const b of [...G.blds].sort((p, q) => q.y - p.y)) { const r = boundsOf(b); if (sx > r.x && sx < r.x + r.w && sy > r.y && sy < r.y + r.h) return b; }
  return null;
}

// Enter or space: a press is a tap, held a moment it's a hold
let keyHeld = false, keyTimer = 0;
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.code;
  if ((k === "Space" || k === "Enter") && e.target.closest && e.target.closest("a, button")) return;
  if (k === "Space" || k === "Enter") {
    e.preventDefault();
    unlockSound();
    lastInput = "keys";
    if (e.repeat) return;
    if (state !== "play") { press(); return; }
    keyHeld = true;
    clearTimeout(keyTimer);
    keyTimer = setTimeout(() => { if (keyHeld) { keyHeld = false; hold(); } }, 450);
    return;
  }
  if (state !== "play") return;
  if (["Tab", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(k)) e.preventDefault();
  unlockSound();
  lastInput = "keys";
  if (k === "Escape") { if (placing) cancelPlacing(); return; }
  if (placing) {  // the arrows move the new building
    const step = 24, mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[k];
    if (mv) { placing.x = clamp(placing.x + mv[0], 40, MAP_W - 40); placing.y = clamp(placing.y + mv[1], 40, MAP_H - 40); placing.lock = false; }
    return;
  }
  if (k === "Tab") cycle(e.shiftKey ? -1 : 1);
  else if (k === "KeyE" || k === "ArrowRight") cycle(1);
  else if (k === "KeyQ" || k === "ArrowLeft") cycle(-1);
  else if (k === "ArrowUp") moveHl(-1);
  else if (k === "ArrowDown") moveHl(1);
  else if (k === "Digit1") jumpTo(0);
  else if (k === "Digit2") jumpTo(1);
  else if (k === "Digit3") jumpTo(2);
});
addEventListener("keyup", (e) => {
  if ((e.code === "Space" || e.code === "Enter") && keyHeld) { keyHeld = false; clearTimeout(keyTimer); press(); }
});
addEventListener("blur", () => { keyHeld = false; clearTimeout(keyTimer); });

// ---------------------------------------------------------------- sound (once the page has been clicked or a key pressed)

let audio = null;
function unlockSound() {
  if (!audio) { try { audio = new AudioContext(); } catch { audio = null; } }
  audio?.resume?.();
}
function sound(kind, vol = 1) {
  if (!audio || audio.state !== "running") return;
  const t = audio.currentTime;
  const tone = (f, at, len, gain, type = "sine", to) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t + at);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + at + len);
    g.gain.setValueAtTime(0, t + at);
    g.gain.linearRampToValueAtTime(gain * vol, t + at + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + at + len);
    o.connect(g);
    g.connect(audio.destination);
    o.start(t + at);
    o.stop(t + at + len + 0.02);
  };
  if (kind === "select") { tone(1180, 0, 0.06, 0.035); tone(1770, 0.02, 0.07, 0.018); }
  else if (kind === "step") tone(2300, 0, 0.025, 0.016, "triangle");
  else if (kind === "ok") { tone(660, 0, 0.09, 0.04); tone(990, 0.06, 0.14, 0.035); }
  else if (kind === "place") { tone(300, 0, 0.1, 0.05, "triangle", 190); tone(900, 0.05, 0.1, 0.025); }
  else if (kind === "no") tone(220, 0, 0.14, 0.05, "triangle", 150);
  else if (kind === "chop") { tone(210, 0, 0.05, 0.028, "triangle", 120); tone(1100, 0, 0.012, 0.01, "square"); }
  else if (kind === "hammer") tone(420, 0, 0.04, 0.022, "triangle", 260);
  else if (kind === "pick") tone(1500 + Math.random() * 300, 0, 0.03, 0.012);
  else if (kind === "mine") { tone(2600, 0, 0.05, 0.012); tone(3900, 0.005, 0.04, 0.006); }
  else if (kind === "drop") tone(520, 0, 0.05, 0.014, "triangle");
  else if (kind === "trained") { tone(880, 0, 0.14, 0.045); tone(1320, 0.09, 0.22, 0.04); }
  else if (kind === "built") { tone(523, 0, 0.18, 0.045); tone(784, 0.1, 0.3, 0.04); }
  else if (kind === "growl") tone(140, 0, 0.32, 0.04, "triangle", 95);
  else if (kind === "lost") tone(440, 0, 0.6, 0.04, "triangle", 160);
  else if (kind === "wolf") { tone(660, 0, 0.12, 0.035); tone(495, 0.1, 0.2, 0.03); }
  else if (kind === "begin") { tone(392, 0, 0.5, 0.03); tone(523, 0.15, 0.6, 0.03); }
  else if (kind === "age") { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 1 - i * 0.1, 0.045)); tone(262, 0, 1.5, 0.03, "triangle"); }
}

function count(name, params) { gtag("event", name, params); }

// ---------------------------------------------------------------- the frame

function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth;
  H = innerHeight;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  const mr = mirror.getBoundingClientRect();
  mirrorSize = Math.round(mr.width) || 148;
  mirrorDPR = DPR;
  mirror.width = Math.round(mirrorSize * DPR);
  mirror.height = Math.round(mirrorSize * DPR);
  mirrorDrawn = "";
  const nr = mini.getBoundingClientRect();
  miniW = Math.round(nr.width) || 180;
  miniH = Math.round(nr.height) || 120;
  miniDPR = DPR;
  mini.width = Math.round(miniW * DPR);
  mini.height = Math.round(miniH * DPR);
  miniDirty = true;
  sizeWorld();
}

let last = performance.now(), acc = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  now = t;
  if (G) {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 4) { step(STEP); acc -= STEP; n++; }
    if (n === 4) acc = 0;
  }
  takeEvents();
  workSounds();
  if (state === "play") { if (G.won) beginEnding(); else if (G.lost) lose(); }
  if (state === "ending" && t - stateAt > 2800) win();
  if (state === "title" && G.t > 240) backdrop();  // keep the title's clearing fresh
  if (t - pk.turnAt > 700) pk.turn = 0;
  camStep(dt);
  render(t);
  drawMini(t);
  hud(t);
  face(t);
  connState();
  requestAnimationFrame(frame);
}

addEventListener("resize", resize);
backdrop();
base = makeBase();
initWorld();
resize();
showPanel();
connect();
requestAnimationFrame(frame);

// For tests: the game's state and a few of its moves, from the browser's console or a script
window.hamlet = {
  get G() { return G; }, get state() { return state; }, get world() { return worldOk; }, cam,
  get three() { return { renderer, composer, scene, camera, sun, gtao, tiltA, tiltB }; },
  pick, perform, hold, flyTo, selected, addUnit, ACTIONS, run: (s) => { for (let i = 0; i < s * 60; i++) step(STEP); },
};
</script>
</body>
</html>
