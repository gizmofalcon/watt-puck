  for (let i = 0; i < 3; i++) {
    const q = clamp(k * 1.4 - i * 0.18, 0, 1);
    if (q <= 0 || q >= 1) continue;
    ctx.strokeStyle = `rgba(255, 214, 10, ${(0.5 * (1 - q)).toFixed(3)})`;
    ctx.lineWidth = 2;
    ell(G.tc.x, G.tc.y + 6, 80 + q * 760, 55 + q * 520);
    ctx.stroke();
  }
}

// ---------------------------------------------------------------- the minimap

const mini = $("mini"), mctx = mini.getContext("2d");
const miniBase = document.createElement("canvas");
let miniW = 180, miniH = 120, miniDPR = 1, miniDirty = true;

function drawMiniBase() {
  miniBase.width = Math.round(miniW * miniDPR);
  miniBase.height = Math.round(miniH * miniDPR);
  const c = miniBase.getContext("2d"), k = miniW / MAP_W;
  c.setTransform(miniDPR, 0, 0, miniDPR, 0, 0);
  c.fillStyle = "#0e0e10";
  c.fillRect(0, 0, miniW, miniH);
  const g = c.createRadialGradient(HOME.x * k, HOME.y * k, 0, HOME.x * k, HOME.y * k, 760 * k);
  g.addColorStop(0, "rgba(245, 245, 247, 0.06)");
  g.addColorStop(1, "rgba(245, 245, 247, 0)");
  c.fillStyle = g;
  c.fillRect(0, 0, miniW, miniH);
  c.strokeStyle = "#1c2731";
  c.lineWidth = Math.max(1.5, 60 * k);
  c.beginPath();
  for (let y = 0; y <= MAP_H; y += 40) c.lineTo(riverX(y) * k, y * k);
  c.stroke();
  for (const r of G.res) {
    if (r.amt <= 0) continue;
    c.fillStyle = r.type === "wood" ? "#2b3a30" : r.type === "food" ? "#9a5468" : "#c4a24f";
    c.beginPath(); c.arc(r.x * k, r.y * k, r.t === "seam" ? 2.6 : 1.3, 0, TAU); c.fill();
  }
  c.fillStyle = "#2c2c30";
  for (const r of G.rocks) { c.beginPath(); c.arc(r.x * k, r.y * k, 1.2, 0, TAU); c.fill(); }
  miniDirty = false;
}
function drawMini(t) {
  if (!G || state === "title") return;
  if (miniDirty) drawMiniBase();
  const k = miniW / MAP_W;
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.clearRect(0, 0, mini.width, mini.height);
  mctx.drawImage(miniBase, 0, 0);
  mctx.setTransform(miniDPR, 0, 0, miniDPR, 0, 0);
  mctx.save();
  mctx.beginPath(); mctx.roundRect ? mctx.roundRect(0, 0, miniW, miniH, 12) : mctx.rect(0, 0, miniW, miniH); mctx.clip();
  for (const b of G.blds) {
    const s = SIZE[b.kind];
    mctx.fillStyle = b.done ? "rgba(245, 245, 247, 0.9)" : "rgba(245, 245, 247, 0.4)";
    mctx.fillRect(b.x * k - Math.max(1.5, (s.w * k) / 2), b.y * k - Math.max(1.2, (s.d * k) / 2), Math.max(3, s.w * k), Math.max(2.4, s.d * k));
  }
  for (const w of G.wolves) { mctx.fillStyle = "rgba(226, 150, 150, 0.95)"; mctx.beginPath(); mctx.arc(w.x * k, w.y * k, 1.8, 0, TAU); mctx.fill(); }
  for (const u of G.units) { mctx.fillStyle = "rgba(245, 245, 247, 0.85)"; mctx.beginPath(); mctx.arc(u.x * k, u.y * k, u.kind === "militia" ? 1.8 : 1.4, 0, TAU); mctx.fill(); }
  const sel = state === "play" || state === "ending" ? selected() : null;
  if (sel) {
    mctx.fillStyle = Y;
    mctx.beginPath(); mctx.arc(sel.x * k, sel.y * k, 2.4, 0, TAU); mctx.fill();
    mctx.strokeStyle = "rgba(255, 214, 10, 0.5)";
    mctx.lineWidth = 1;
    mctx.beginPath(); mctx.arc(sel.x * k, sel.y * k, 4.5 + (calm ? 0 : Math.sin(t / 300)), 0, TAU); mctx.stroke();
  }
  const s = scaleOf(), vw = (W / s) * k, vh = (H / s) * k;
  mctx.strokeStyle = "rgba(245, 245, 247, 0.55)";
  mctx.lineWidth = 1;
  mctx.strokeRect(cam.x * k - vw / 2, cam.y * k - vh / 2, vw, vh);
  mctx.restore();
}
let miniDrag = false;
function miniLook(e) {
  const r = mini.getBoundingClientRect();
  cam.x = clamp(((e.clientX - r.left) / r.width) * MAP_W, 0, MAP_W);
  cam.y = clamp(((e.clientY - r.top) / r.height) * MAP_H, 0, MAP_H);
  cam.free = true;
  cam.flight = null;
  clampCam();
}
mini.addEventListener("pointerdown", (e) => { if (state !== "play") return; e.stopPropagation(); miniDrag = true; mini.setPointerCapture?.(e.pointerId); miniLook(e); });
mini.addEventListener("pointermove", (e) => { if (miniDrag) miniLook(e); });
mini.addEventListener("pointerup", () => { miniDrag = false; });
mini.addEventListener("pointercancel", () => { miniDrag = false; });

// ---------------------------------------------------------------- the puck on the page

// It draws what the puck shows, from the same face; its slots and middle can be clicked
const mirror = $("mirror"), rctx = mirror.getContext("2d");
let mirrorSize = 148, mirrorDPR = 1, mirrorDrawn = "", lastFace = null;

function drawMirror(f) {
  const S = mirrorSize, k = S / 466, c = rctx, p = f.params;
  c.setTransform(mirrorDPR, 0, 0, mirrorDPR, 0, 0);
  c.clearRect(0, 0, S, S);
  c.save();
  c.translate(S / 2, S / 2);
  c.fillStyle = "#000";
  c.beginPath(); c.arc(0, 0, S / 2, 0, TAU); c.fill();
  c.strokeStyle = "rgba(245, 245, 247, 0.16)";
  c.lineWidth = 1;
  c.beginPath(); c.arc(0, 0, S / 2 - 0.5, 0, TAU); c.stroke();
  const rad = (deg) => ((deg - 90) * Math.PI) / 180;
  if (p.seg >= 2) {
    const span = 360 / p.seg;
    c.lineWidth = 14 * k;
    c.lineCap = "round";
    for (let i = 0; i < p.seg; i++) {
      const on = i === p.idx, a0 = i * span - (span - 10) / 2;
      c.strokeStyle = on ? Y : "#2C2C2E";
      c.shadowColor = on ? "rgba(255, 214, 10, 0.6)" : "transparent";
      c.shadowBlur = on ? 8 : 0;
      c.beginPath(); c.arc(0, 0, 204 * k, rad(a0 + 3), rad(a0 + span - 13)); c.stroke();
    }
    c.shadowBlur = 0;
  } else if (typeof p.p === "number") {
    const n = 50;
    c.lineWidth = Math.max(1, 3 * k);
    for (let i = 0; i <= n; i++) {
      const a = rad(210 + (i / n) * 300), lit = i / n <= p.p + 1e-6, r0 = (i % 5 ? 199 : 188) * k, r1 = 214 * k;
      c.strokeStyle = lit ? (p.on === 0 ? "#8E8E93" : Y) : "#2C2C2E";
      c.beginPath(); c.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); c.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); c.stroke();
    }
  }
  c.textAlign = "center";
  c.textBaseline = "middle";
  const text = (s, y, size, weight, col, maxW) => {
    let fs = size;
    c.font = `${weight} ${fs}px Nunito, sans-serif`;
    while (c.measureText(s).width > maxW && fs > 7) { fs -= 0.5; c.font = `${weight} ${fs}px Nunito, sans-serif`; }
    c.fillStyle = col;
    c.fillText(s, 0, y);
  };
  if (f.label) text(f.label, -108 * k, Math.max(10, 28 * k), 700, "#8E8E93", 300 * k);
  if (p.msg) text(p.msg, 4 * k, Math.max(13, 42 * k), 800, p.ok ? Y : "#F5F5F7", 350 * k);
  if (p.dn) {
    for (let i = 0; i < p.dn; i++) {
      c.fillStyle = i < (p.dk || 0) ? Y : "#2C2C2E";
      c.beginPath(); c.arc((i - (p.dn - 1) / 2) * 20 * k, 112 * k, Math.max(1.6, 5 * k), 0, TAU); c.fill();
    }
  }
  if (p.sub) text(p.sub, 150 * k, Math.max(8.5, 18 * k), 700, "#7C7C82", 240 * k);
  c.restore();
}

let mirrorHold = null;
mirror.addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  unlockSound();
  lastInput = e.pointerType === "touch" ? "touch" : "mouse";
  if (state !== "play") { press(); return; }
  const r = mirror.getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
  const d = Math.hypot(x, y) / (r.width / 2), f = lastFace && lastFace.params;
  if (d > 0.62 && f && f.seg >= 2 && !placing) {
    const a = ((Math.atan2(x, -y) * 180) / Math.PI + 360) % 360, span = 360 / f.seg, i = Math.floor(((a + span / 2) % 360) / span);
    const sel = selected();
    if (i === hlOf(sel)) press();
    else { sel.hl = i; pk.flash = ""; sound("step"); puckSound("click"); }
    return;
  }
  mirrorHold = setTimeout(() => { mirrorHold = null; hold(); }, 450);
});
mirror.addEventListener("pointerup", () => { if (mirrorHold) { clearTimeout(mirrorHold); mirrorHold = null; press(); } });
for (const ev of ["pointerleave", "pointercancel"]) mirror.addEventListener(ev, () => { if (mirrorHold) { clearTimeout(mirrorHold); mirrorHold = null; } });

// ---------------------------------------------------------------- around the map

const shortAt = { food: NEVER, wood: NEVER, gold: NEVER };
const shown = {};
let lastStock = null;
function put(id, v) { if (shown[id] !== v) { shown[id] = v; $(id).textContent = v; } }
function bump(el) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

function hud(t) {
  if (!G) return;
  for (const k of ["food", "wood", "gold"]) {
    const v = Math.floor(G.stock[k]);
    if (lastStock && v > lastStock[k] && state === "play") bump($("s-" + k));
    put(k, String(v));
    $("s-" + k).classList.toggle("short", t - shortAt[k] < 1200);
  }
  lastStock = { ...G.stock };
  put("pop", String(pop()));
  put("cap", String(cap()));
  put("clock", fmt(state === "won" || state === "ending" ? G.wonAt : state === "play" || state === "lost" ? G.t : 0));
  document.body.classList.toggle("playing", state === "play" || state === "ending");
  document.body.classList.toggle("title", state === "title");
  document.body.classList.toggle("placing", !!placing && state === "play");
  if (state === "play" || state === "ending") {
    const e = selected(), acts = actionsOf(e), a = acts[hlOf(e)];
    put("whoName", nameOf(e));
    put("whoDoing", doing(e));
    let v = -1, yel = false;
    if (e.t === "unit") v = e.hp / e.max;
    else if (!e.done) v = e.prog;
    else if (e.queue.length) { v = e.jt / TIME[e.queue[0]]; yel = e.queue[0] === "advance"; }
    const bar = $("whoBar");
    bar.classList.toggle("off", v < 0);
    bar.classList.toggle("y", yel);
    if (v >= 0) bar.style.setProperty("--v", clamp(v, 0, 1).toFixed(3));
    const flash = pk.flash && t - pk.flashAt < 1800;
    let act;
    if (placing) act = `<b>Where?</b> ${canPlace(placing.kind, placing.x, placing.y) || "Click to build here"}`;
    else if (flash) act = pk.flash;
    else if (a) act = `<b>${a.name}</b> ${a.cost ? costText(a.cost) : ""}`;
    else act = e.t === "bld" && !e.done ? "<b>Rising</b>" : `<b>Home for 5</b> ${pop()} of ${cap()} people`;
    if (shown.act !== act) { shown.act = act; $("whoAct").innerHTML = act; }
    $("whoAct").classList.toggle("no", !!flash && !placing);
  }
  put("hint", hintText());
}

function hintText() {
  if (state !== "play") return "";
  const puck = lastInput === "puck";
  if (placing) return puck ? "Point the puck where it goes, then tap. Swipe to cancel." : "Click where it goes, or move it with the arrows and press Enter. Esc to cancel.";
  if (G.t < 14) return puck ? "Turn the puck to choose, tap to do it. Swipe for the next one." : "Up and down to choose, Enter to do it. E and Q for the next one.";
  const idle = G.units.filter((u) => u.kind === "villager" && u.st === "idle").length;
  if (idle && G.t > 30) return `${idle === 1 ? "A villager is" : idle + " villagers are"} idle.${puck ? "" : " Press 1 to find them."}`;
  return "";
}

// Toasts: what just happened; a click goes to it
function toast(text, subject, warn) {
  const box = $("toasts"), el = document.createElement("div");
  el.className = "toast" + (warn ? " warn" : "");
  el.innerHTML = "<i></i>";
  el.append(text);
  el.addEventListener("click", () => {
    if (state !== "play" || !subject) return;
    if (G.units.includes(subject) || G.blds.includes(subject)) pick(subject);
  });
  box.prepend(el);
  requestAnimationFrame(() => el.classList.add("show"));
  while (box.children.length > 3) box.lastChild.remove();
  setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 500); }, 3600);
}

// What the game said happened, turned into words, sounds and marks on the map
let workAt = 0;
function takeEvents() {
  if (!G) return;
  const live = state === "play" || state === "ending";
  for (const ev of G.events) {
    if (ev.k === "gone") { miniDirty = true; continue; }
    if (ev.k === "drop") {
      if (live && onScreen(G.tc, 0)) {
        fx.push({ k: "text", x: G.tc.x + (Math.random() - 0.5) * 50, y: G.tc.y - 64, s: `+${ev.amt} ${ev.type}`, at: now });
        sound("drop");
      }
      continue;
    }
    if (ev.k === "wolf") fx.push({ k: "puff", x: ev.x, y: ev.y, at: now });
    if (!live) continue;
    switch (ev.k) {
      case "attack": toast(`${nameOf(ev.u)} is under attack`, ev.u, true); sound("growl"); break;
      case "dead":
        toast(`${nameOf(ev.u)} was lost`, null, true);
        sound("lost");
        if (ev.u.id === selId) { const r = roster(); pick(r.find((e) => kindOf(e) === kindOf(ev.u)) || G.tc, true); }
        if (placing && placing.by === ev.u.id) placing = null;
        break;
      case "out": toast(ev.p.type === "gold" ? "The gold seam is empty" : `${ev.p.type === "wood" ? "Wood" : "Berries"} ran out ${ev.p.name}`); break;
      case "none": toast(`No ${ev.type === "food" ? "berries" : ev.type} left to gather`); break;
      case "trained": toast(`${nameOf(ev.u)} is ready`, ev.u); sound("trained"); break;
      case "built": toast(ev.b.kind === "barracks" ? "The barracks are built" : `${nameOf(ev.b)} is built`, ev.b); sound("built"); break;
      case "wolf": toast(ev.left ? `A wolf is down, ${ev.left} left` : "The last wolf is down"); sound("wolf"); break;
      case "advancing": toast("Advancing to a new age", G.tc, true); sound("begin"); break;
      case "age": break;
      case "lost": break;
    }
  }
  G.events.length = 0;
}

// Work sounds: the picked villager's, and now and then one in view
function workSounds() {
  if (state !== "play" || !audio) return;
  const sel = selected();
  for (const u of G.units) {
    if (u.kind !== "villager" || u.moving || (u.st !== "work" && u.st !== "build")) continue;
    const beat = Math.floor((G.t + u.id * 0.37) / 0.85);
    if (u.beat === beat) continue;
    u.beat = beat;
    const mine = u === sel;
    if (!mine && (now - workAt < 450 || !onScreen(u, 0))) continue;
    if (!mine) workAt = now;
    sound(u.st === "build" ? "hammer" : u.task === "wood" ? "chop" : u.task === "gold" ? "mine" : "pick", mine ? 1 : 0.35);
  }
}

const PANELS = {
  title: () => `<h1>Hamlet</h1>
    <p>Three villagers, a Town Centre and a clearing in the woods. Gather food, wood and gold, mind the wolves, and <b>advance to a new age.</b></p>
    <p class="how">${bridge.up ? "Swipe on the puck to pick a villager or a building, and the map goes to it. Turn the puck to choose what it does, tap to do it. On a building, hold, then point the puck where it goes."
      : "Tab, or Q and E, picks a villager or a building. Up and down, or the wheel, choose what it does, and Enter does it. Click to pick, drag to look around, and hold Enter to choose where a building goes."}</p>
    ${best ? `<p class="how">Best time ${fmt(best)}</p>` : ""}
    <div class="go"><button class="btn" type="button" data-go>Start</button><span class="or">${bridge.up ? "or tap the puck" : "or press Enter"}</span></div>`,
  won: () => {
    const v = G.units.filter((u) => u.kind === "villager").length, h = G.blds.filter((b) => b.kind === "house" && b.done).length;
    return `<h1>A new age</h1>
    <p>Your hamlet advanced in ${fmt(G.wonAt)}${newBest ? ", a new best." : prevBest ? `. Best ${fmt(prevBest)}.` : "."}</p>
    <p class="how">${v} villager${v === 1 ? "" : "s"}, ${h} house${h === 1 ? "" : "s"}${G.stats.wolves ? `, ${G.stats.wolves} wol${G.stats.wolves === 1 ? "f" : "ves"} down` : ""}${G.stats.lost ? `, ${G.stats.lost} lost to wolves` : ""}.</p>
    <div class="go"><button class="btn" type="button" data-go>Play again</button><a class="btn quiet" href="../">More games</a></div>`;
  },
  lost: () => `<h1>The hamlet is empty</h1>
    <p>No villagers are left, and there isn't the food for another. Keep them clear of the wolves, or send militia first.</p>
    <div class="go"><button class="btn" type="button" data-go>Try again</button><a class="btn quiet" href="../">More games</a></div>`,
};
function showPanel() {
  const make = PANELS[state];
  $("panel").classList.toggle("show", !!make);
  $("panel").inert = !make;  // hidden, its buttons can't be pressed: space would start the game again
  if (!make) { document.activeElement?.blur?.(); return; }
  $("card").innerHTML = make();
  $("card").querySelector("[data-go]")?.addEventListener("click", (e) => { e.stopPropagation(); unlockSound(); start(); });
}

// ---------------------------------------------------------------- playing

function start() {
  newGame();
  state = "play";
  stateAt = now;
  placing = null;
  pk.turn = 0;
  pk.flash = "";
  selId = 0;
  pick(G.units[0], true);
  showPanel();
  miniDirty = true;
  $("toasts").replaceChildren();
  lastStock = null;
  sound("select");
  count("game_start", { game: "hamlet", input: lastInput });
}
function beginEnding() {
  state = "ending";
  stateAt = now;
  placing = null;
  pick(G.tc, true);
  sound("age");
  puckSound("ok");
  toast("A new age", G.tc, true);
}
function win() {
  state = "won";
  stateAt = now;
  prevBest = best;
  newBest = !!prevBest && G.wonAt < prevBest;
  if (!prevBest || G.wonAt < prevBest) { best = G.wonAt; try { localStorage.setItem("hamlet.best", String(best)); } catch {} }
  showPanel();
  count("game_end", { game: "hamlet", result: "won", seconds: Math.round(G.wonAt) });
}
function lose() {
  state = "lost";
  stateAt = now;
  placing = null;
  showPanel();
  count("game_end", { game: "hamlet", result: "lost", seconds: Math.round(G.t) });
}

// The title: the same clearing behind it, three villagers at work
function backdrop() {
  newGame();
  G.units.forEach((v, i) => setTask(v, ["food", "wood", "wood"][i]));
}

// ---------------------------------------------------------------- the puck, through Watt

const bridge = { ws: null, up: false, sent: "", sentAt: 0, retry: 3000, heard: NEVER };

function connect() {
  let ws;
  try { ws = new WebSocket(BRIDGE); } catch { setTimeout(connect, bridge.retry); return; }
  ws.onopen = () => {
    bridge.ws = ws;
    bridge.up = true;
    bridge.retry = 3000;
    bridge.sent = "";
    send({ type: "hello", kind: "game", name: "Hamlet" });
    presence();
    if (state === "title") showPanel();
  };
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    const t = performance.now();
    if (m.type === "aim") { bridge.heard = t; aimMove(m.dx, m.dy); }
    else if (m.type === "input") {
      bridge.heard = t;
      pk.inputAt = t;
      lastInput = "puck";
      if (m.input === "tap") press();
      else if (m.input === "hold") hold();
      else if (m.input === "swipe") swipe(m.value);
      else if (m.input === "turn" && typeof m.value === "number" && state === "play" && !placing) turn(m.value);
    }
  };
  ws.onclose = () => {
    const was = bridge.up;
    bridge.ws = null;
    bridge.up = false;
    if (was && state === "title") showPanel();
    setTimeout(connect, bridge.retry);
    bridge.retry = Math.min(bridge.retry * 1.5, 15000);  // Watt isn't open: ask less often
  };
}
function send(o) { if (bridge.ws && bridge.ws.readyState === 1) bridge.ws.send(JSON.stringify(o)); }

// Watt gives the puck to the page you're looking at
function presence() { send({ type: "presence", visible: !document.hidden, focused: document.hasFocus(), title: document.title }); }
addEventListener("focus", presence);
addEventListener("blur", presence);
document.addEventListener("visibilitychange", presence);
setInterval(presence, 2000);

function swipe(d) {
  if (state !== "play") return;
  if (placing) { cancelPlacing(); return; }
  if (d === "l") cycle(-1);
  else if (d === "r") cycle(1);
  else if (d === "d") jumpKind(1);
  else if (d === "u") jumpKind(-1);
}
// Pointing the puck moves the new building, as an air mouse moves a pointer
function aimMove(dx, dy) {
  if (!placing || state !== "play" || typeof dx !== "number" || typeof dy !== "number") return;
  const k = W / (SWEEP_DEG * 100) / scaleOf();
  placing.x = clamp(placing.x + dx * k, 40, MAP_W - 40);
  placing.y = clamp(placing.y + dy * k, 40, MAP_H - 40);
  placing.lock = false;
  lastInput = "puck";
}

// The face goes when it changes: quickly right after the puck is used, at most every 100 ms otherwise
function face(t) {
  const f = faceNow();
  lastFace = f;
  const s = JSON.stringify(f);
  if (s !== mirrorDrawn) { mirrorDrawn = s; drawMirror(f); }
  if (!bridge.up) return;
  const gap = t - pk.inputAt < 400 ? 40 : 100;
  if (s === bridge.sent || t - bridge.sentAt < gap) return;
  bridge.sent = s;
  bridge.sentAt = t;
  send(f);
}

function connState() {
  const puck = bridge.up && performance.now() - bridge.heard < 4000;
  $("conn").classList.toggle("puck", puck);
  put("connText", puck ? "Puck" : bridge.up ? "Watt is on: try the puck" : "Mouse");
}

// ---------------------------------------------------------------- mouse, touch, keys

let drag = null, wheelAcc = 0, wheelAt = 0;
cv.addEventListener("pointerdown", (e) => {
  unlockSound();
  if (state !== "play") return;
  drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false, touch: e.pointerType === "touch" };
  cv.setPointerCapture?.(e.pointerId);
});
cv.addEventListener("pointermove", (e) => {
  if (state !== "play") return;
  if (placing && e.pointerType === "mouse" && (!drag || !drag.moved)) {
    const w = toWorld(e.clientX, e.clientY);
    placing.x = w.x;
    placing.y = w.y;
    placing.lock = false;
    lastInput = "mouse";
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; document.body.classList.add("dragging"); }
  if (drag.moved) {
    const s = scaleOf();
    cam.x = drag.cx - dx / s;
    cam.y = drag.cy - dy / s;
    cam.free = true;
    cam.flight = null;
    clampCam();
  }
});
cv.addEventListener("pointerup", (e) => {
  const d = drag;
  drag = null;
  document.body.classList.remove("dragging");
  if (!d || d.moved || state !== "play") return;
  lastInput = d.touch ? "touch" : "mouse";
  const w = toWorld(e.clientX, e.clientY);
  if (placing) { placing.x = w.x; placing.y = w.y; place(); return; }
  const hit = hitTest(w.x, w.y, d.touch ? 26 : 18);
  if (hit) pick(hit);
});
cv.addEventListener("pointercancel", () => { drag = null; document.body.classList.remove("dragging"); });
cv.addEventListener("contextmenu", (e) => { e.preventDefault(); if (placing) cancelPlacing(); });
cv.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (state !== "play" || placing) return;
  const t = performance.now();
  if (t - wheelAt > 400) wheelAcc = 0;
  wheelAcc += e.deltaMode ? e.deltaY * 30 : e.deltaY;
  if (Math.abs(wheelAcc) >= 50 && t - wheelAt > 90) { moveHl(Math.sign(wheelAcc)); wheelAcc = 0; wheelAt = t; lastInput = "mouse"; }
}, { passive: false });

function hitTest(x, y, reach) {
  let best = null, bd = reach;
  for (const u of G.units) { const d = Math.hypot(u.x - x, u.y - 10 * FIG - y); if (d < bd) { bd = d; best = u; } }
  if (best) return best;
  for (let i = G.blds.length - 1; i >= 0; i--) {
    const b = G.blds[i], s = SIZE[b.kind];
    if (x > b.x - s.w / 2 - 6 && x < b.x + s.w / 2 + 6 && y > b.y - s.d / 2 - s.h - 12 && y < b.y + s.d / 2 + 6) return b;
  }
  return null;
}

// Enter or space: a press is a tap, held a moment it's a hold
let keyHeld = false, keyTimer = 0;
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.code;
  if ((k === "Space" || k === "Enter") && e.target.closest && e.target.closest("a, button")) return;
  if (k === "Space" || k === "Enter") {
    e.preventDefault();
    unlockSound();
    lastInput = "keys";
    if (e.repeat) return;
    if (state !== "play") { press(); return; }
    keyHeld = true;
    clearTimeout(keyTimer);
    keyTimer = setTimeout(() => { if (keyHeld) { keyHeld = false; hold(); } }, 450);
    return;
  }
  if (state !== "play") return;
  if (["Tab", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(k)) e.preventDefault();
  unlockSound();
  lastInput = "keys";
  if (k === "Escape") { if (placing) cancelPlacing(); return; }
  if (placing) {  // the arrows move the new building
    const step = 24, mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[k];
    if (mv) { placing.x = clamp(placing.x + mv[0], 40, MAP_W - 40); placing.y = clamp(placing.y + mv[1], 40, MAP_H - 40); placing.lock = false; }
    return;
  }
  if (k === "Tab") cycle(e.shiftKey ? -1 : 1);
  else if (k === "KeyE" || k === "ArrowRight") cycle(1);
  else if (k === "KeyQ" || k === "ArrowLeft") cycle(-1);
  else if (k === "ArrowUp") moveHl(-1);
  else if (k === "ArrowDown") moveHl(1);
  else if (k === "Digit1") jumpTo(0);
  else if (k === "Digit2") jumpTo(1);
  else if (k === "Digit3") jumpTo(2);
});
addEventListener("keyup", (e) => {
  if ((e.code === "Space" || e.code === "Enter") && keyHeld) { keyHeld = false; clearTimeout(keyTimer); press(); }
});
addEventListener("blur", () => { keyHeld = false; clearTimeout(keyTimer); });

// ---------------------------------------------------------------- sound (once the page has been clicked or a key pressed)

let audio = null;
function unlockSound() {
  if (!audio) { try { audio = new AudioContext(); } catch { audio = null; } }
  audio?.resume?.();
}
function sound(kind, vol = 1) {
  if (!audio || audio.state !== "running") return;
  const t = audio.currentTime;
  const tone = (f, at, len, gain, type = "sine", to) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t + at);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + at + len);
    g.gain.setValueAtTime(0, t + at);
    g.gain.linearRampToValueAtTime(gain * vol, t + at + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + at + len);
    o.connect(g);
    g.connect(audio.destination);
    o.start(t + at);
    o.stop(t + at + len + 0.02);
  };
  if (kind === "select") { tone(1180, 0, 0.06, 0.035); tone(1770, 0.02, 0.07, 0.018); }
  else if (kind === "step") tone(2300, 0, 0.025, 0.016, "triangle");
  else if (kind === "ok") { tone(660, 0, 0.09, 0.04); tone(990, 0.06, 0.14, 0.035); }
  else if (kind === "place") { tone(300, 0, 0.1, 0.05, "triangle", 190); tone(900, 0.05, 0.1, 0.025); }
  else if (kind === "no") tone(220, 0, 0.14, 0.05, "triangle", 150);
  else if (kind === "chop") { tone(210, 0, 0.05, 0.028, "triangle", 120); tone(1100, 0, 0.012, 0.01, "square"); }
  else if (kind === "hammer") tone(420, 0, 0.04, 0.022, "triangle", 260);
  else if (kind === "pick") tone(1500 + Math.random() * 300, 0, 0.03, 0.012);
  else if (kind === "mine") { tone(2600, 0, 0.05, 0.012); tone(3900, 0.005, 0.04, 0.006); }
  else if (kind === "drop") tone(520, 0, 0.05, 0.014, "triangle");
  else if (kind === "trained") { tone(880, 0, 0.14, 0.045); tone(1320, 0.09, 0.22, 0.04); }
  else if (kind === "built") { tone(523, 0, 0.18, 0.045); tone(784, 0.1, 0.3, 0.04); }
  else if (kind === "growl") tone(140, 0, 0.32, 0.04, "triangle", 95);
  else if (kind === "lost") tone(440, 0, 0.6, 0.04, "triangle", 160);
  else if (kind === "wolf") { tone(660, 0, 0.12, 0.035); tone(495, 0.1, 0.2, 0.03); }
  else if (kind === "begin") { tone(392, 0, 0.5, 0.03); tone(523, 0.15, 0.6, 0.03); }
  else if (kind === "age") { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 1 - i * 0.1, 0.045)); tone(262, 0, 1.5, 0.03, "triangle"); }
}

function count(name, params) { gtag("event", name, params); }

// ---------------------------------------------------------------- the frame

function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth;
  H = innerHeight;
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  const mr = mirror.getBoundingClientRect();
  mirrorSize = Math.round(mr.width) || 148;
  mirrorDPR = DPR;
  mirror.width = Math.round(mirrorSize * DPR);
  mirror.height = Math.round(mirrorSize * DPR);
  mirrorDrawn = "";
  const nr = mini.getBoundingClientRect();
  miniW = Math.round(nr.width) || 180;
  miniH = Math.round(nr.height) || 120;
  miniDPR = DPR;
  mini.width = Math.round(miniW * DPR);
  mini.height = Math.round(miniH * DPR);
  miniDirty = true;
  if (!groundPat) {
    groundPat = ctx.createPattern(makeGround(), "repeat");
    if (groundPat && groundPat.setTransform && typeof DOMMatrix === "function") groundPat.setTransform(new DOMMatrix([0.5, 0, 0, 0.5, 0, 0]));
  }
}

let last = performance.now(), acc = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  now = t;
  if (G) {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 4) { step(STEP); acc -= STEP; n++; }
    if (n === 4) acc = 0;
  }
  takeEvents();
  workSounds();
  if (state === "play") { if (G.won) beginEnding(); else if (G.lost) lose(); }
  if (state === "ending" && t - stateAt > 2800) win();
  if (state === "title" && G.t > 240) backdrop();  // keep the title's clearing fresh
  if (t - pk.turnAt > 700) pk.turn = 0;
  camStep(dt);
  render(t);
  drawMini(t);
  hud(t);
  face(t);
  connState();
  requestAnimationFrame(frame);
}

addEventListener("resize", resize);
backdrop();
mood = makeMood();
resize();
showPanel();
connect();
requestAnimationFrame(frame);
</script>
</body>
