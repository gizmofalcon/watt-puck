<style>
  :root { --bg: #0A0A0B; --w: #F5F5F7; --mute: rgba(245, 245, 247, 0.56); --faint: rgba(245, 245, 247, 0.4); --y: #FFD60A; --ease: cubic-bezier(0.16, 1, 0.3, 1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color-scheme: dark; overflow: hidden; }
  body { color: var(--w); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; touch-action: none;
    font: 600 16px/24px "Nunito", ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  b { font-weight: inherit; color: var(--w); }
  #map { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  body.playing #map { cursor: grab; }
  body.dragging #map { cursor: grabbing; }
  body.placing #map { cursor: crosshair; }

  .btn { display: inline-flex; align-items: center; justify-content: center; height: 42px; padding: 0 20px; border: 0; border-radius: 21px; cursor: pointer;
    background: var(--y); color: #000; font: inherit; font-size: 15px; font-weight: 800; white-space: nowrap;
    transition: filter 0.16s, transform 0.16s var(--ease), background-color 0.16s; }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(0.97); }
  .btn.quiet { background: rgba(255, 255, 255, 0.08); color: var(--w); font-weight: 700; }
  .btn.quiet:hover { filter: none; background: rgba(255, 255, 255, 0.13); }
  .btn.small { height: 32px; padding: 0 14px; border-radius: 16px; font-size: 14px; }
  .btn svg { width: 8px; height: 12px; margin-right: 8px; opacity: 0.6; }
  :focus-visible { outline: 2px solid var(--y); outline-offset: 3px; }

  /* along the top: the way back, what the village has, how long it has taken */
  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; pointer-events: none; z-index: 2; }
  .hud > * { pointer-events: auto; }
  .stock { display: flex; align-items: center; gap: 18px; font: 500 14px/1 "Roboto Mono", ui-monospace, Menlo, monospace; color: var(--mute); }
  .stock span { display: flex; align-items: center; gap: 7px; transition: color 0.3s; }
  .stock svg { width: 16px; height: 16px; flex: none; }
  .stock b { font-weight: 500; color: var(--w); transition: color 0.3s; }
  .stock .bump { animation: bump 0.35s var(--ease); }
  .stock .short, .stock .short b { color: var(--y); }
  @keyframes bump { 40% { transform: scale(1.18); } }

  /* the whole clearing, small */
  .mini { position: fixed; top: 72px; right: 24px; width: 180px; height: 120px; border-radius: 12px; cursor: pointer; touch-action: none;
    box-shadow: inset 0 0 0 1px rgba(245, 245, 247, 0.1), 0 10px 30px rgba(0, 0, 0, 0.4); transition: opacity 0.5s var(--ease); }

  /* what just happened */
  .toasts { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none; z-index: 3; }
  .toast { display: flex; align-items: center; gap: 10px; padding: 7px 16px 7px 14px; border-radius: 18px; background: rgba(22, 22, 24, 0.86);
    box-shadow: inset 0 0 0 1px rgba(245, 245, 247, 0.08); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    font-size: 14px; line-height: 20px; white-space: nowrap; cursor: pointer; pointer-events: auto;
    opacity: 0; transform: translateY(-6px); transition: opacity 0.4s var(--ease), transform 0.5s var(--ease); }
  .toast.show { opacity: 1; transform: none; }
  .toast i { width: 6px; height: 6px; border-radius: 50%; background: rgba(245, 245, 247, 0.4); flex: none; }
  .toast.warn i { background: var(--y); box-shadow: 0 0 8px rgba(255, 214, 10, 0.6); }

  /* the selection: the puck as it looks now, and a few words on what's picked */
  .who { position: fixed; left: 20px; bottom: 20px; display: flex; align-items: center; gap: 16px; padding: 10px; border-radius: 90px;
    background: rgba(16, 16, 18, 0.9); box-shadow: inset 0 0 0 1px rgba(245, 245, 247, 0.07), 0 10px 40px rgba(0, 0, 0, 0.45); z-index: 2; }
  #mirror { display: block; width: 148px; height: 148px; border-radius: 50%; cursor: pointer; touch-action: none; flex: none; }
  .info { width: 200px; margin-right: 16px; }
  .info .nm { font-size: 17px; line-height: 22px; font-weight: 800; letter-spacing: -0.01em; }
  .info .doing { margin-top: 2px; font-size: 14px; line-height: 20px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .bar { height: 3px; margin: 10px 0 12px; border-radius: 2px; background: rgba(245, 245, 247, 0.12); overflow: hidden; }
  .info .bar i { display: block; height: 100%; border-radius: 2px; background: rgba(245, 245, 247, 0.72); transform-origin: left;
    transform: scaleX(var(--v, 1)); transition: transform 0.3s var(--ease); }
  .info .bar.y i { background: var(--y); }
  .info .bar.off { visibility: hidden; }
  .info .act { font-size: 14px; line-height: 20px; color: var(--faint); text-wrap: pretty; }
  .info .act b { font-weight: 700; color: var(--w); }
  .info .act.no, .info .act.no b { color: var(--y); }
  body:not(.playing) .info { display: none; }
  body.title .stock { visibility: hidden; }
  body:not(.playing) .who { padding: 10px; }
  body:not(.playing) .mini { opacity: 0; pointer-events: none; }

  .panel { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; pointer-events: none; opacity: 0; transition: opacity 0.5s var(--ease); z-index: 4;
    background: radial-gradient(ellipse at center, rgba(10, 10, 11, 0.86), rgba(10, 10, 11, 0.55) 60%, rgba(10, 10, 11, 0.2)); }
  .panel.show { opacity: 1; }
  .panel.show .card { pointer-events: auto; }
  .card { max-width: 480px; text-align: center; transform: translateY(8px); transition: transform 0.6s var(--ease); }
  .panel.show .card { transform: none; }
  .card h1 { margin: 0; font-size: 44px; line-height: 52px; font-weight: 800; letter-spacing: -0.02em; }
  .card p { margin: 14px 0 0; font-size: 18px; line-height: 28px; color: var(--mute); text-wrap: pretty; }
  .card .how { margin-top: 18px; font-size: 15px; line-height: 23px; color: var(--faint); }
  .card .go { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 16px; margin-top: 28px; }
  .card .or { font-size: 14px; color: var(--faint); }

  .hint { position: fixed; left: 440px; right: 220px; bottom: 22px; margin: 0; text-align: center; font-size: 14px; line-height: 20px; color: var(--faint);
    pointer-events: none; transition: opacity 0.4s; }
  .conn { position: fixed; right: 24px; bottom: 20px; display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 24px; color: var(--faint); }
  .conn i { width: 7px; height: 7px; border-radius: 50%; background: rgba(245, 245, 247, 0.25); transition: background-color 0.3s, box-shadow 0.3s; }
  .conn.puck i { background: var(--y); box-shadow: 0 0 10px rgba(255, 214, 10, 0.6); }

  @media (max-width: 960px) {
    .hint { left: 16px; right: 16px; bottom: 200px; }
  }
  @media (max-width: 640px) {
    .hud { padding: 16px; }
    .stock { gap: 12px; font-size: 13px; }
    .stock .clock { display: none; }
    .mini { top: 62px; right: 16px; width: 132px; height: 88px; }
    .toasts { top: 158px; }
    .who { left: 10px; right: 10px; bottom: 10px; gap: 12px; padding: 8px; }
    body:not(.playing) .who { right: auto; }
    #mirror { width: 112px; height: 112px; }
    .info { flex: 1; min-width: 0; width: auto; }
    .hint { bottom: 140px; }
    .conn { display: none; }
    .card h1 { font-size: 36px; line-height: 44px; }
    .card p { font-size: 17px; line-height: 26px; }
  }
  @media (max-width: 400px) {
    .stock .pop { display: none; }
  }
</style>

<script>
// Hamlet: a small village in a clearing. Gather food, wood and gold, build, keep clear of the wolves,
// and advance the village to a new age.
//
// The puck plays it through Watt on this Mac: the page joins Watt's local bridge as a game and asks
// for the "panel" face, with what the selected villager or building can do as slots round the puck's
// rim. A swipe picks the next one (the map pans to it), turning the puck moves round the slots, a tap
// does the lit one. Holding on a building lets you point the puck at where it goes. A mouse and keys
// play it too, and the small puck in the corner works as a controller of its own.

const MAP_W = 3000, MAP_H = 2000;
const VIEW_H = 900;                  // world units the screen is tall, at rest
const HOME = { x: 1500, y: 1000 };   // where the Town Centre stands
const SAFE_R = 380;                  // wolves keep out of the village
const BUILD_R = 520;                 // and buildings go up this close to the Town Centre
const CARRY = 10, GATHER = 0.7;      // a load, and how much of it is gathered a second
const SPEED = { villager: 70, militia: 76, flee: 74, prowl: 34, chase: 90 };
const HP = { villager: 25, militia: 45, wolf: 30 };
const BITE = 3, HIT = 6;             // a wolf's bite and a militia's blow: health a second
const AGGRO = 225, LEASH = 900, PROWL_R = 320;  // a wolf notices villagers this close, chases them this far from its den
const COST = { villager: { food: 50 }, militia: { food: 60, gold: 20 }, house: { wood: 30 }, barracks: { wood: 120 },
  advance: { food: 300, wood: 200, gold: 100 } };
const TIME = { villager: 11, militia: 13, advance: 20, house: 12, barracks: 20 };  // seconds to train, to advance, to build
const MAX = { house: 5, barracks: 1, queue: 5 };
const SIZE = { tc: { w: 132, d: 84, h: 30, roof: 30 }, house: { w: 58, d: 42, h: 18, roof: 15 }, barracks: { w: 104, d: 56, h: 22, roof: 0 } };
const AMOUNT = { wood: 100, food: 150, gold: 800 };
const TURN_STEP = 40;                // degrees of turning the puck per slot
const SWEEP_DEG = 40;                // pointing the puck this far moves a new building across the screen
const STEP = 1 / 60;
const TAU = Math.PI * 2;
const BRIDGE = "ws://127.0.0.1:47824";

const cv = document.getElementById("map");
const ctx = cv.getContext("2d");
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
function seeded(a) {
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------------------------------------------------------- the clearing

// A river down the west side, with a bridge and a ford; woods, berries and a seam of gold round the
// village; a wolf den at three of the edges. The same clearing every game, so times compare.
const riverX = (y) => 600 + 60 * Math.sin(y * 0.0024 + 0.4) + 22 * Math.sin(y * 0.0071 + 1.3);
const riverW = (y) => 30 + 5 * Math.sin(y * 0.004 + 2);   // half its width
const CROSSINGS = [{ y: 990 }, { y: 1690 }];               // the bridge, the stepping stones
const side = (x, y) => (x < riverX(y) ? -1 : 1);
const inWater = (x, y, pad = 0) => Math.abs(x - riverX(y)) < riverW(y) + pad;
const onCrossing = (x, y) => CROSSINGS.some((c) => Math.abs(y - c.y) < 20 && Math.abs(x - riverX(c.y)) < riverW(c.y) + 30);

const PLACES = [
  { type: "wood", name: "in the grove", x: 1120, y: 680, r: 130, n: 11 },
  { type: "wood", name: "near the river", strip: [360, 1640], n: 26 },
  { type: "wood", name: "in the north woods", x: 1780, y: 250, r: 240, n: 20 },
  { type: "wood", name: "in the south woods", x: 2480, y: 1670, r: 250, n: 20 },
  { type: "wood", name: "over the river", west: true, n: 34 },
  { type: "food", name: "by the village", x: 1840, y: 1210, r: 74, n: 6 },
  { type: "food", name: "in the east", x: 2240, y: 640, r: 84, n: 6 },
  { type: "food", name: "over the river", x: 330, y: 1380, r: 80, n: 5 },
  { type: "gold", name: "at the seam", x: 2190, y: 1260, n: 1 },
  { type: "wood", name: "", lone: true, n: 16 },
];
const ROCKS = [[1150, 1520, 22], [1188, 1500, 14], [1118, 1484, 12], [1214, 1542, 10], [1088, 1534, 9], [2080, 160, 18], [2112, 188, 11],
  [2600, 420, 16], [2630, 442, 9], [880, 1770, 15], [905, 1792, 9], [2860, 1700, 14], [1640, 1668, 12], [1664, 1684, 7], [400, 620, 16], [430, 640, 9]];
const DENS = [{ x: 2600, y: 1240 }, { x: 1320, y: 110 }, { x: 2170, y: 1915 }];  // east (by the gold), north, south
const PATHS = [[1430, 992, 700, 990, 1060, 1010], [1560, 1040, 1820, 1190, 1700, 1140], [1566, 1010, 2140, 1240, 1880, 1060],
  [1450, 958, 1150, 720, 1260, 860], [1520, 958, 1700, 440, 1640, 700]];
const PATROL = Array.from({ length: 8 }, (_, i) => ({ x: HOME.x + Math.cos((i / 8) * TAU) * 600, y: HOME.y + Math.sin((i / 8) * TAU) * 430 }));

function blob(R, n, r, squash = 0.72) {
  return Array.from({ length: n }, (_, i) => { const a = (i / n) * TAU, k = r * (0.82 + R() * 0.3); return [Math.cos(a) * k, Math.sin(a) * k * squash]; });
}

function makeWorld() {
  const R = seeded(1701);
  for (const [x, y, r] of ROCKS) G.rocks.push({ t: "rock", x, y, r, pts: blob(R, 7, r) });
  const free = (x, y, r, gap) => {
    if (x < 50 || y < 50 || x > MAP_W - 50 || y > MAP_H - 50) return false;
    if (Math.abs(x - riverX(y)) < riverW(y) + r + 28) return false;
    if (Math.hypot(x - HOME.x, y - HOME.y) < 300) return false;
    if (CROSSINGS.some((c) => Math.abs(y - c.y) < 60 && Math.abs(x - riverX(c.y)) < 170)) return false;  // the crossings stay clear
    if (Math.abs(y - 990) < 48 && x > riverX(990) && x < HOME.x) return false;                          // and the road to the bridge
    for (const o of G.res) if (Math.hypot(o.x - x, o.y - y) < o.r + r + gap) return false;
    for (const o of G.rocks) if (Math.hypot(o.x - x, o.y - y) < o.r + r + gap) return false;
    for (const d of DENS) if (Math.hypot(d.x - x, d.y - y) < 60) return false;
    return true;
  };
  PLACES.forEach((pl, i) => {
    G.places.push({ name: pl.name, type: pl.type, left: 0 });
    if (pl.type === "gold") { addRes("seam", "gold", pl.x, pl.y, 36, i, R); return; }
    for (let k = 0, tries = 0; k < pl.n && tries < 5000; tries++) {
      let x, y;
      if (pl.strip) { y = pl.strip[0] + R() * (pl.strip[1] - pl.strip[0]); x = riverX(y) + riverW(y) + 62 + R() * 220; }
      else if (pl.west) { y = 70 + R() * (MAP_H - 140); x = 60 + R() * Math.max(0, riverX(y) - riverW(y) - 130); }
      else if (pl.lone) { x = 120 + R() * (MAP_W - 240); y = 100 + R() * (MAP_H - 200); }
      else { const a = R() * TAU, d = Math.sqrt(R()) * pl.r; x = pl.x + Math.cos(a) * d; y = pl.y + Math.sin(a) * d * 0.8; }
      const r = pl.type === "wood" ? 13 + R() * 7 : 10;
      if (pl.lone && (side(x, y) < 0 || Math.hypot(x - HOME.x, y - HOME.y) < 430)) continue;
      if (!free(x, y, r, pl.lone ? 70 : pl.type === "wood" ? 10 : 12)) continue;
      addRes(pl.type === "wood" ? "tree" : "bush", pl.type, x, y, r, i, R);
      k++;
    }
  });
}

function addRes(t, type, x, y, r, place, R) {
  const n = { t, id: G.id++, type, x, y, r, amt: AMOUNT[type], max: AMOUNT[type], place, hit: -9 };
  if (t === "tree") { n.pine = R() < 0.35; n.tone = ["#18221c", "#1b261f", "#1d2821", "#172019"][Math.floor(R() * 4)]; }
  if (t === "bush") n.dots = Array.from({ length: 8 }, () => [(R() - 0.5) * 15, -3 - R() * 11]);
  if (t === "seam") {
    n.rocks = [[-22, -2, 17], [8, -12, 19], [26, 2, 14], [-4, 10, 15], [-34, 10, 10], [34, 14, 9]]
      .map(([ox, oy, s]) => ({ x: ox, y: oy, pts: blob(R, 7, s, 0.7) })).sort((a, b) => a.y - b.y);
    n.flecks = Array.from({ length: 12 }, () => ({ x: (R() - 0.5) * 64, y: (R() - 0.5) * 22 - 2, s: 1.6 + R() * 1.8 }));
  }
  G.res.push(n);
  G.places[place].left += n.amt;
  return n;
}

// ---------------------------------------------------------------- the game

let G = null;                 // the village, the wolves, what's left in the woods
let rnd = Math.random;        // the wolves' wandering; the clearing itself comes from a fixed seed

function newGame() {
  G = { t: 0, stock: { food: 150, wood: 80, gold: 0 }, units: [], wolves: [], blds: [], res: [], rocks: [], places: [], events: [],
    id: 1, n: { villager: 0, militia: 0, house: 0, barracks: 0 }, tc: null, advancing: false, won: false, wonAt: 0, lost: false, checkAt: 1,
    stats: { lost: 0, wolves: 0 } };
  makeWorld();
  G.tc = addBuilding("tc", HOME.x, HOME.y, true);
  for (const [dx, dy] of [[-46, 74], [0, 84], [46, 74]]) addUnit("villager", HOME.x + dx, HOME.y + dy);
  for (const d of DENS) G.wolves.push({ t: "wolf", id: G.id++, x: d.x, y: d.y, hp: HP.wolf, max: HP.wolf, den: d, st: "prowl", tx: d.x, ty: d.y,

// Villagers: walk to the nearest of what they were told to gather, gather a load, carry it home, again
function villagerStep(v, dt) {
  switch (v.st) {
    case "go": {
      const r = v.res;
      if (!r || r.amt <= 0) { seek(v); break; }
      if (walk(v, v.gx, v.gy, SPEED.villager, dt, 6, r.t === "seam" ? r : null)) { v.st = "work"; v.dir = r.x < v.x ? -1 : 1; }
      break;
    }
    case "work": {
      const r = v.res;
      if (!r || r.amt <= 0) { seek(v); break; }
      v.moving = false;
      r.hit = G.t;
      v.frac += GATHER * dt;
      while (v.frac >= 1 && r.amt > 0 && v.carry.amt < CARRY) {
        v.frac -= 1;
        r.amt--;
        v.carry.amt++;
        v.carry.type = r.type;
        const p = G.places[r.place];
        if (--p.left === 0 && p.name) emit("out", { p });
      }
      if (r.amt <= 0) emit("gone", { r });
      if (v.carry.amt >= CARRY) { v.st = "home"; v.frac = 0; }
      else if (r.amt <= 0) seek(v);
      break;

    case "home":

    case "build": {

function seek(v) {

  if (v.carry.amt && (v.carry.type !== task || v.carry.amt >= CARRY)) { v.st = "home"; return; }

    if (v.carry.amt) { v.st = "home"; return; }

  v.res = r;

    if (r.t !== "seam") for (const u of G.units) if (u !== v && u.res === r) d += 50;  // a tree to yourself, if there's one

function drop(v) {
  if (v.carry.amt > 0) { G.stock[v.carry.type] += v.carry.amt; emit("drop", { type: v.carry.type, amt: v.carry.amt }); }

// Militia: go after wolves when told, or stand guard by the Town Centre, or walk a ring round the village
function militiaStep(m, dt) {

    const w = m.foe;
    if ((m.order === "guard" && dist(w, HOME) > 780) || (m.order === "patrol" && dist(w, m) > 460)) m.foe = null;

      if (dist(m, w) > 18) { walk(m, w.x, w.y, SPEED.militia, dt, 16); m.fight = false; }

        m.moving = false;
        m.fight = true;

function wolfStep(w, dt) {

// Toward (gx, gy): over the river by the nearer crossing, round buildings and rocks. True once within `near`.
function walk(u, gx, gy, speed, dt, near = 4, ignore = null) {
  const far = Math.hypot(gx - u.x, gy - u.y);

  let dx = p.x - u.x, dy = p.y - u.y;

    dx = (c.x - u.x) / cl;
    dy = (c.y - u.y) / cl;

function waypoint(u, gx, gy) {
  if (onCrossing(u.x, u.y) || inWater(u.x, u.y, 2)) {  // on the bridge or the stones: on to the far bank

    for (const k of CROSSINGS) if (Math.abs(k.y - u.y) < Math.abs(c.y - u.y)) c = k;
    const s = side(gx, gy);
    if (side(u.x, u.y) !== s || inWater(u.x, u.y, 4)) return { x: riverX(c.y) + s * (riverW(c.y) + 24), y: c.y };

// A building in the way: the shortest way round it, by its corners. Returns the next corner to make for.
function detour(u, px, py, ignore) {

    if (t < ht) { ht = t; hit = b; }

function crosses(x0, y0, x1, y1, b, m) {

// Steer round rocks and the seam ahead, unless that's where you're going
function avoid(u, dx, dy, ignore, reach) {

  for (const b of G.blds) {  // 5 clear of every wall, with round corners, so people slide round them
    const s = SIZE[b.kind], hw = s.w / 2, hd = s.d / 2;
    const cx = clamp(u.x, b.x - hw, b.x + hw), cy = clamp(u.y, b.y - hd, b.y + hd), dx = u.x - cx, dy = u.y - cy, d = Math.hypot(dx, dy);
    if (d >= 5) continue;
    if (d > 1e-6) { u.x = cx + (dx / d) * 5; u.y = cy + (dy / d) * 5; }
    else if (hw - Math.abs(u.x - b.x) < hd - Math.abs(u.y - b.y)) u.x = b.x + (u.x < b.x ? -hw - 5 : hw + 5);
    else u.y = b.y + (u.y < b.y ? -hd - 5 : hd + 5);
  }
  const round = (r, R) => {
    const dx = u.x - r.x, dy = u.y - r.y, d = Math.hypot(dx, dy);
    if (d < R && d > 0.01) { u.x = r.x + (dx / d) * R; u.y = r.y + (dy / d) * R; }
  };
  for (const r of G.rocks) round(r, r.r + 5);
  for (const r of G.res) if (r.t === "seam") round(r, r.r + 4);
  u.x = clamp(u.x, 8, MAP_W - 8);
  u.y = clamp(u.y, 8, MAP_H - 8);
}

// People keep a little apart; two on the move only a little, so they can pass in a lane
function separate() {
  const a = G.units;
  for (let i = 0; i < a.length; i++) {
    for (let j = i + 1; j < a.length; j++) {
      const p = a[i], q = a[j], dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy;
      if (d2 >= 196 || d2 < 1e-4) continue;
      const d = Math.sqrt(d2), k = (14 - d) * (p.moving && q.moving ? 0.06 : 0.25), ux = dx / d, uy = dy / d;
      const px = p.x, py = p.y, qx = q.x, qy = q.y;
      p.x -= ux * k; p.y -= uy * k; q.x += ux * k; q.y += uy * k;
      settle(p, px, py);
      settle(q, qx, qy);

}

// ---------------------------------------------------------------- what each thing can do

const ACTIONS = {
  villager: [{ id: "wood", name: "Chop wood" }, { id: "food", name: "Gather food" }, { id: "gold", name: "Mine gold" },
    { id: "house", name: "Build house", cost: COST.house, build: "house" }, { id: "barracks", name: "Build barracks", cost: COST.barracks, build: "barracks" },
    { id: "help", name: "Help build" }],
  militia: [{ id: "hunt", name: "Hunt wolves" }, { id: "guard", name: "Guard" }, { id: "patrol", name: "Patrol" }],
  tc: [{ id: "villager", name: "Train villager", cost: COST.villager }, { id: "advance", name: "Advance", cost: COST.advance }],
  barracks: [{ id: "militia", name: "Train militia", cost: COST.militia }],
  house: [],
};
const actionsOf = (e) => (e.t === "bld" && !e.done ? [] : ACTIONS[e.kind]);

// Why it can't be done now, or "" if it can
function whyNot(e, a, at) {
  if (a.build) {
    if (nBuilt(a.build) >= MAX[a.build]) return a.build === "house" ? "Five is the most" : "Already have one";
    if (at) { const w = canPlace(a.build, at.x, at.y); if (w) return w; }
  }
  if (a.id === "villager" || a.id === "militia") {
    if (e.queue.length >= MAX.queue) return "Five in line already";
    if (pop() + queued() >= cap()) return cap() >= 30 ? "The village is full" : "No room: build a house";
  }
  if (a.id === "advance" && G.advancing) return "Already advancing";
  if (a.id === "help" && !nearestSite(e)) return "Nothing to build";
  if (a.id === "hunt" && !G.wolves.length) return "No wolves left";
  if ((a.id === "wood" || a.id === "food" || a.id === "gold") && !G.res.some((r) => r.type === a.id && r.amt > 0)) return `No ${a.id} left`;
  if (a.cost) for (const k of ["food", "wood", "gold"]) if (a.cost[k] > G.stock[k]) return `Need ${a.cost[k] - G.stock[k]} more ${k}`;
  return "";
}

function perform(e, a, at) {
  const why = whyNot(e, a, at);
  if (why) return why;
  if (a.build) {
    const spot = at || autoSpot(a.build, e);
    if (!spot) return "No room near home";
    pay(a.cost);
    sendToBuild(e, addBuilding(a.build, spot.x, spot.y, false));
  } else if (a.id === "help") sendToBuild(e, nearestSite(e));
  else if (e.kind === "villager") setTask(e, a.id);
  else if (e.kind === "militia") setOrder(e, a.id);
  else {
    pay(a.cost);
    e.queue.push(a.id);
    if (a.id === "advance") G.advancing = true;
  }
  return "";
}
function pay(cost) { for (const k in cost) G.stock[k] -= cost[k]; }

// Where a building may go: on open ground, near home, clear of the river, trees, bushes and rocks,
// with room to walk round it
function canPlace(kind, x, y) {
  const s = SIZE[kind], hw = s.w / 2, hd = s.d / 2, lane = 40;
  if (x - hw < 40 || x + hw > MAP_W - 40 || y - hd < 60 || y + hd > MAP_H - 40) return "No room here";
  if (Math.hypot(x - HOME.x, y - HOME.y) > BUILD_R) return "Too far from home";
  for (const yy of [y - hd, y, y + hd]) if (Math.abs(x - riverX(yy)) < riverW(yy) + hw + lane) return "No room here";
  for (const b of G.blds) {
    const t = SIZE[b.kind];
    if (Math.abs(x - b.x) < hw + t.w / 2 + lane && Math.abs(y - b.y) < hd + t.d / 2 + lane) return "No room here";
  }
  const hits = (cx, cy, r) => Math.hypot(Math.max(0, Math.abs(cx - x) - hw), Math.max(0, Math.abs(cy - y) - hd)) < r;
  for (const r of G.res) if ((r.amt > 0 || r.t === "seam") && hits(r.x, r.y, r.t === "tree" ? 14 : r.t === "seam" ? r.r + lane : r.r + 6)) return "No room here";
  for (const r of G.rocks) if (hits(r.x, r.y, r.r + lane)) return "No room here";
  for (const u of G.units) if (u.st === "build" || u.st === "work") if (hits(u.x, u.y, 4)) return "No room here";
  return "";
}

// A free spot near the Town Centre, leaning towards the builder
function autoSpot(kind, v) {
  let best = null, bs = Infinity;
  for (let r = 150; r <= BUILD_R; r += 30) {
    const n = Math.max(10, Math.round(r / 20));
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + r * 0.01, x = HOME.x + Math.cos(a) * r * 1.12, y = HOME.y + Math.sin(a) * r * 0.86;
      if (canPlace(kind, x, y)) continue;
      const sc = r + 0.25 * Math.hypot(x - v.x, y - v.y);
      if (sc < bs) { bs = sc; best = { x, y }; }
    }
  }
  return best;
}

// ---------------------------------------------------------------- picking, choosing, doing

let state = "title";          // title, play, ending (the new age, a moment before the panel), won, lost
let stateAt = 0, now = 0, lastInput = "mouse", best = 0, prevBest = 0, newBest = false;
let selId = 0, selAt = 0;     // what's picked, and since when
let placing = null;           // choosing where a building goes
const NEVER = -1e9;           // a time long before the page opened
const pk = { s: "", sn: 0, flash: "", flashAt: NEVER, okAt: NEVER, turn: 0, turnAt: 0, inputAt: NEVER };
try { best = +localStorage.getItem("hamlet.best") || 0; } catch { best = 0; }

// One ring of everything that can be picked: the Town Centre, villagers, militia, then buildings
const roster = () => [G.tc, ...G.units.filter((u) => u.kind === "villager"), ...G.units.filter((u) => u.kind === "militia"),

}

function pick(e, quiet) {

    selAt = now;

    // a villager or militia shows what it's doing now; a building, what you chose last
    const acts = actionsOf(e);
    const i = e.kind === "villager" ? acts.findIndex((a) => a.id === (e.task === "build" ? "help" : e.task))
      : e.kind === "militia" ? acts.findIndex((a) => a.id === e.order) : -1;
    if (i >= 0) e.hl = i;

}
function cycle(d) {
  const r = roster(), i = Math.max(0, r.findIndex((e) => e.id === selId));
  pick(r[(i + d + r.length) % r.length]);
}
// Up and down skip to the next kind: villagers (idle ones first), militia, buildings
function jumpKind(d) {
  const r = roster(), k = kindOf(selected());
  for (let j = 1; j <= 2; j++) {
    const want = (k + d * j + 3) % 3, list = r.filter((e) => kindOf(e) === want);
    if (list.length) { pick(want === 0 ? list.find((v) => v.st === "idle") || list[0] : list[0]); return; }
  }
}
function jumpTo(k) {
  const list = roster().filter((e) => kindOf(e) === k);
  if (!list.length) { no(k === 1 ? "No militia yet" : "No one yet"); return; }
  let e = list[0];
  if (k === 0) {

function moveHl(d) {

function turn(deg) {

  pk.turnAt = performance.now();
  while (pk.turn >= TURN_STEP) { pk.turn -= TURN_STEP; moveHl(1); }
  while (pk.turn <= -TURN_STEP) { pk.turn += TURN_STEP; moveHl(-1); }

// A tap on the puck, Enter, a click on the lit slot
function press() {
  if (state !== "play") {
    if (state === "title" || ((state === "won" || state === "lost") && performance.now() - stateAt > 800)) start();
    return;
  }
  if (placing) { place(); return; }
  const e = selected(), acts = actionsOf(e);
  if (!acts.length) { no(e.t === "bld" && !e.done ? "Still rising" : "A home: nothing to do"); return; }
  const a = acts[hlOf(e)], why = perform(e, a);
  if (why) no(why);

// A hold: choose where a building goes, or bring the view back to what's picked

  const e = selected(), a = actionsOf(e)[hlOf(e)];
  if (a && a.build) {
    const why = whyNot(e, a);
    if (why) { no(why); return; }
    const spot = autoSpot(a.build, e) || { x: HOME.x, y: HOME.y + 160 };
    placing = { kind: a.build, by: e.id, a, x: spot.x, y: spot.y, lock: true };
    cam.free = false;
    flyTo();
    sound("select");
    puckSound("tick");
    return;
  }

  flyTo();
  puckSound("tock");
}
function place() {
  const p = placing, v = G.units.find((u) => u.id === p.by);

  const fit = canPlace(p.kind, p.x, p.y);
  if (fit) { no(fit); return; }
  placing = null;
  const why = perform(v, p.a, { x: p.x, y: p.y });

  puckSound("tock");
}
function no(why) {

  pk.flashAt = performance.now();
  sound("no");
  puckSound("no");
  const m = /more (food|wood|gold)/.exec(why);
  if (m) shortAt[m[1]] = performance.now();
}
function yes(kind) {
  pk.okAt = performance.now();
  pk.flash = "";
  sound(kind);
  puckSound("ok");
}
const puckSound = (s) => { pk.s = s; pk.sn++; };

// ---------------------------------------------------------------- what the puck shows

function costText(c) { return ["food", "wood", "gold"].filter((k) => c[k]).map((k) => `${c[k]} ${k}`).join(", "); }

function doing(e) {
  if (e.t === "bld") {
    if (!e.done) {
      const on = G.units.some((u) => u.bld === e && u.st === "build");
      return on ? `Rising, ${Math.floor(e.prog * 100)}%` : `${Math.floor(e.prog * 100)}%, needs a builder`;
    }
    if (e.queue.length) {
      const j = e.queue[0], left = Math.max(1, Math.ceil(TIME[j] - e.jt));
      return j === "advance" ? `Advancing, ${left} s left` : `Training, ${left} s left`;
    }
    return e.kind === "barracks" ? "Ready to train" : "Home for 5";
  }
  if (e.kind === "militia") return e.foe ? "Fighting a wolf" : { hunt: "Hunting wolves", guard: "Guarding home", patrol: "On patrol" }[e.order];
  const where = { wood: "the woods", food: "the berries", gold: "the gold" };
  switch (e.st) {
    case "go": return `Going to ${where[e.task] || "work"}`;
    case "work": return `${{ wood: "Chopping", food: "Picking", gold: "Mining" }[e.task] || "Gathering"}, ${e.carry.amt} of ${CARRY}`;
    case "home": return `Taking ${e.carry.amt} ${e.carry.type} home`;
    case "tobuild": return "Going to build";
    case "build": return e.bld ? `Building, ${Math.floor(e.bld.prog * 100)}%` : "Building";

}

}

// The "panel" face: the picked thing's name, its actions round the rim, the lit one in the middle
function faceNow() {
  const P = {};
  let label = "Hamlet";
  if (state === "title") { P.msg = "Start"; P.sub = "Tap to begin"; }
  else if (state === "ending" || state === "won") { P.msg = "New age"; P.ok = 1; P.sub = `In ${fmt(G.wonAt)}`; }
  else if (state === "lost") { P.msg = "Empty"; P.sub = "Tap to try again"; }
  else {
    const e = selected();
    label = nameOf(e);
    if (placing) {
      const why = canPlace(placing.kind, placing.x, placing.y);
      P.msg = "Where?";
      P.sub = why || "Tap to build here";
      P.ok = why ? 0 : 1;
      P.aim = 1;
    } else {
      const acts = actionsOf(e), i = hlOf(e), a = acts[i];
      if (acts.length > 1) { P.seg = acts.length; P.idx = i; }
      if (a) { P.msg = a.name; P.sub = subFor(e, a); }
      else if (e.t === "bld" && !e.done) { P.msg = "Rising"; P.sub = doing(e); }
      else { P.msg = "Home for 5"; P.sub = `${pop()} of ${cap()} people`; }
      if (e.t === "bld" && acts.length < 2) {
        const k = !e.done ? e.prog : e.queue.length ? e.jt / TIME[e.queue[0]] : -1;
        if (k >= 0) { P.p = Math.round(k * 50) / 50; P.on = 1; }
      }
      if (e.t === "bld" && e.queue.length) { P.dn = Math.min(10, e.queue.length); P.dk = 1; }
      if (pk.flash && now - pk.flashAt < 1800) P.sub = pk.flash;
      if (now - pk.okAt < 450) P.ok = 1;

  if (pk.sn) { P.s = pk.s; P.sn = pk.sn; }

}

// ---------------------------------------------------------------- the camera

const cam = { x: HOME.x, y: HOME.y, z: 1, free: false, flight: null };
let W = 0, H = 0, DPR = 1;
const baseScale = () => clamp(H / VIEW_H, 0.6, 1.5);
const scaleOf = () => baseScale() * cam.z;

function camTarget() {
  if (placing) {
    if (placing.lock) return { x: placing.x, y: placing.y };
    // the view follows the building once it nears the edge
    const s = scaleOf(), mx = (W / s) * 0.3, my = (H / s) * 0.28;
    return { x: clamp(cam.x, placing.x - mx, placing.x + mx), y: clamp(cam.y, placing.y - my, placing.y + my) };
  }
  const e = selected();
  return e.t === "bld" ? { x: e.x, y: e.y - SIZE[e.kind].h * 0.6 } : { x: e.x, y: e.y - 12 };
}
// A pan to what's picked; going far, the view pulls back a little on the way
function flyTo() {
  const t = camTarget(), d = Math.hypot(t.x - cam.x, t.y - cam.y);
  if (calm) { cam.x = t.x; cam.y = t.y; cam.z = 1; cam.flight = null; return; }
  if (d < 2) { cam.flight = null; return; }
  cam.flight = { x: cam.x, y: cam.y, z: cam.z, t: 0, dur: clamp(0.4 + d / 2600, 0.4, 1.05), out: clamp((d - 260) / 2400, 0, 0.3) };
}
function camStep(dt) {

    cam.y = calm ? HOME.y : HOME.y + Math.cos(t * 0.05) * 150;
    cam.z = 1;
    clampCam();
    return;
  }
  if (cam.free && !placing) { clampCam(); return; }

    const a = calm ? 1 : 1 - Math.exp(-dt * 6);
    cam.x += (t.x - cam.x) * a;
    cam.y += (t.y - cam.y) * a;
    cam.z += (1 - cam.z) * a;

}

  const s = scaleOf(), vw = W / s, vh = H / s;

  cam.y = vh >= MAP_H + 300 ? MAP_H / 2 : clamp(cam.y, vh / 2 - 150, MAP_H - vh / 2 + 150);
}
function toWorld(sx, sy) { const s = scaleOf(); return { x: cam.x + (sx - W / 2) / s, y: cam.y + (sy - H / 2) / s }; }
function onScreen(e, m = 40) {
  const s = scaleOf(), x = (e.x - cam.x) * s + W / 2, y = (e.y - cam.y) * s + H / 2;
  return x > -m && x < W + m && y > -m && y < H + m;
}

// ---------------------------------------------------------------- drawing

const INK = "rgba(245, 245, 247, 0.88)", Y = "#FFD60A";
const FIG = 1.35;             // people and wolves are drawn this much larger than they're reckoned
const WALL = "#1d1d21", ROOF_F = "#34343a", ROOF_S = "#2c2c31", ROOF_B = "#25252a";

const fx = [];                // drawn for a moment: "+10 wood", a wolf gone
const list = [];

function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); }
function blobPath(x, y, pts) {

// The ground: specks and tufts, once, as a tile; and the lie of the land, once, small and soft
function makeGround() {

  const g = c.getContext("2d"), R = seeded(99);

}
function makeMood() {

    gr.addColorStop(1, `rgba(${rgb}, 0)`);

  glow(HOME.x, HOME.y, 780, "245, 245, 240", 0.035);       // the clearing
  glow(HOME.x, HOME.y + 30, 280, "225, 205, 170", 0.05);   // the yard, trodden
  for (const r of G.res) if (r.t === "tree") glow(r.x, r.y, 90, "0, 0, 0", 0.16);  // under the trees
  for (let y = 0; y <= MAP_H; y += 25) glow(riverX(y), y, riverW(y) + 60, "0, 0, 0", 0.1);  // damp banks
  for (const [x0, y0, x1, y1] of [[0, 0, 140, 0], [MAP_W, 0, MAP_W - 140, 0], [0, 0, 0, 140], [0, MAP_H, 0, MAP_H - 140]]) {
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    gr.addColorStop(0, "rgba(0, 0, 0, 0.4)");
    gr.addColorStop(1, "rgba(0, 0, 0, 0)");
    g.fillStyle = gr;
    g.fillRect(0, 0, MAP_W, MAP_H);
  }
  return c;
}

function render(t) {
  const s = scaleOf(), vw = W / s, vh = H / s, L = cam.x - vw / 2, T = cam.y - vh / 2, R = L + vw, B = T + vh;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#070708";  // past the edge of the clearing
  ctx.fillRect(0, 0, W, H);
  if (!G) return;
  ctx.setTransform(DPR * s, 0, 0, DPR * s, DPR * (W / 2 - cam.x * s), DPR * (H / 2 - cam.y * s));
  const gx = Math.max(0, L), gy = Math.max(0, T), gw = Math.min(MAP_W, R) - gx, gh = Math.min(MAP_H, B) - gy;
  if (gw > 0 && gh > 0) {
    ctx.fillStyle = "#0f100f";
    ctx.fillRect(gx, gy, gw, gh);
    if (groundPat) { ctx.fillStyle = groundPat; ctx.fillRect(gx, gy, gw, gh); }
    if (mood) ctx.drawImage(mood, gx / 5, gy / 5, gw / 5, gh / 5, gx, gy, gw, gh);
  }
  drawPaths();
  drawRiver(T, B, t);
  drawCrossings();

  // on the ground: what's picked, and where it's headed
  const sel = state === "play" || state === "ending" ? selected() : null;
  if (sel) groundMarks(sel, t);
  if (G.advancing && !G.won && state === "play") {
    const j = G.tc.queue.indexOf("advance");
    if (j === 0) {
      ctx.strokeStyle = Y;
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.ellipse(G.tc.x, G.tc.y + 6, 108, 74, 0, -Math.PI / 2, -Math.PI / 2 + TAU * (G.tc.jt / TIME.advance));
      ctx.stroke();
    }
  }

  // what stands on it, back to front
  list.length = 0;
  const vis = (x, y, m) => x > L - m && x < R + m && y > T - m && y < B + m * 1.6;
  for (const r of G.res) if (vis(r.x, r.y, 60)) list.push(r);
  for (const r of G.rocks) if (vis(r.x, r.y, 40)) list.push(r);
  for (const b of G.blds) if (vis(b.x, b.y, 150)) list.push(b);
  for (const u of G.units) if (vis(u.x, u.y, 40)) list.push(u);
  for (const w of G.wolves) if (vis(w.x, w.y, 40)) list.push(w);
  list.sort((a, b) => (a.t === "bld" ? a.y + SIZE[a.kind].d / 2 : a.y) - (b.t === "bld" ? b.y + SIZE[b.kind].d / 2 : b.y));
  for (const e of list) {
    if (e.t === "tree") drawTree(e, t);
    else if (e.t === "bush") drawBush(e);
    else if (e.t === "seam") drawSeam(e, t);
    else if (e.t === "rock") drawRock(e);
    else if (e.t === "bld") drawBld(e, t, null);
    else if (e.t === "unit") drawPerson(e, t);
    else drawWolf(e, t);
  }

  // over everything: health, the marker over what's picked, the new building, moments
  for (const e of list) if ((e.t === "unit" || e.t === "wolf") && (e.hp < e.max - 0.01 || e === sel)) bar(e.x, e.y - (e.t === "wolf" ? 26 : 34) * FIG, e.hp / e.max);
  if (sel && sel.t === "unit" && !placing) chevron(sel, t);
  if (placing && state === "play") drawGhost(t);
  drawFx(t);
  if (state === "ending" || state === "won") newAge(t);
}

function drawPaths() {
  ctx.strokeStyle = "rgba(225, 212, 190, 0.04)";
  ctx.lineWidth = 22;
  ctx.lineCap = "round";
  ctx.beginPath();
  for (const [x0, y0, x1, y1, cx, cy] of PATHS) { ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); }
  ctx.stroke();
}

function drawRiver(T, B, t) {
  const y0 = Math.max(-20, Math.floor(T / 20) * 20 - 40), y1 = Math.min(MAP_H + 20, B + 40);
  if (y1 <= y0) return;
  ctx.beginPath();
  for (let y = y0; y <= y1; y += 20) ctx.lineTo(riverX(y) - riverW(y), y);
  for (let y = y1; y >= y0; y -= 20) ctx.lineTo(riverX(y) + riverW(y), y);
  ctx.closePath();
  ctx.fillStyle = "#0c1318";
  ctx.fill();
  ctx.lineWidth = 1.3;
  ctx.strokeStyle = "rgba(245, 245, 247, 0.2)";
  for (const sd of [-1, 1]) {
    ctx.beginPath();
    for (let y = y0; y <= y1; y += 20) ctx.lineTo(riverX(y) + sd * riverW(y), y);
    ctx.stroke();
  }
  // the current, drifting south
  const flow = calm ? 0 : ((t / 1000) * 16) % 46;
  ctx.strokeStyle = "rgba(170, 200, 220, 0.1)";
  ctx.lineWidth = 1.2;
  ctx.lineCap = "round";
  ctx.beginPath();
  for (let k = Math.floor(y0 / 46) - 1; k * 46 < y1; k++) {
    const y = k * 46 + flow + (((k * 37) % 23) + 23) % 23, o = ((((k * 53) % 9) + 9) % 9) / 9 - 0.5;
    ctx.moveTo(riverX(y) + o * riverW(y), y);
    ctx.lineTo(riverX(y + 11) + o * riverW(y + 11), y + 11);
  }
  ctx.stroke();
}

function drawCrossings() {
  const b = CROSSINGS[0], x = riverX(b.y), hw = riverW(b.y) + 16;
  ctx.fillStyle = "#29241f";
  ctx.fillRect(x - hw, b.y - 17, hw * 2, 34);
  ctx.strokeStyle = "rgba(245, 245, 247, 0.12)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let px = x - hw + 6; px < x + hw; px += 7) { ctx.moveTo(px, b.y - 15); ctx.lineTo(px, b.y + 15); }
  ctx.stroke();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(x - hw, b.y - 17); ctx.lineTo(x + hw, b.y - 17);
  ctx.moveTo(x - hw, b.y + 17); ctx.lineTo(x + hw, b.y + 17);
  ctx.stroke();
  ctx.fillStyle = "#1b1b1e";
  for (const px of [x - hw, x, x + hw]) for (const py of [b.y - 17, b.y + 17]) { ctx.fillRect(px - 2.5, py - 2.5, 5, 5); ctx.strokeRect(px - 2.5, py - 2.5, 5, 5); }
  // the stepping stones
  const f = CROSSINGS[1], fx0 = riverX(f.y), fw = riverW(f.y);
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const sx = fx0 - fw + 5 + (i * (fw * 2 - 10)) / 5, sy = f.y + (i % 2 ? 5 : -4);
    ell(sx, sy, 7, 4.6);
    ctx.fillStyle = "#29292d";
    ctx.fill();
    ctx.strokeStyle = "rgba(245, 245, 247, 0.32)";
    ctx.stroke();
  }
}

function drawTree(e, t) {
  const { x, y } = e;
  if (e.amt <= 0) {  // a stump
    ell(x, y - 1, 4.5, 2.2);
    ctx.fillStyle = "#2a241f";
    ctx.fill();
    ctx.strokeStyle = "rgba(245, 245, 247, 0.2)";
    ctx.lineWidth = 1;
    ctx.stroke();
    return;
  }
  const r = e.r, cx = x + (!calm && G.t - e.hit < 0.2 ? Math.sin(t * 0.06) * 0.9 : 0);
  ell(x + r * 0.3, y + 1, r * 0.9, r * 0.32);
  ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
  ctx.fill();
  ctx.strokeStyle = "#3b3129";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - r * 0.8); ctx.stroke();
  ctx.lineJoin = "round";
  if (e.pine) {
    for (let k = 0; k < 3; k++) {
      const w = r * (1 - k * 0.24), yb = y - r * 0.55 - k * r * 0.5;
      ctx.beginPath(); ctx.moveTo(cx - w, yb); ctx.lineTo(cx + w, yb); ctx.lineTo(cx, yb - r * 0.95); ctx.closePath();
      ctx.fillStyle = e.tone;
      ctx.fill();
      ctx.strokeStyle = "rgba(245, 245, 247, 0.22)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    return;
  }
  // a round crown: outlined, then filled over, so only its edge shows
  const cy = y - r * 1.2;
  lobes(cx, cy, r, CROWN);
  ctx.strokeStyle = "rgba(245, 245, 247, 0.24)";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = e.tone;
  ctx.fill();
  ctx.strokeStyle = "rgba(245, 245, 247, 0.1)";
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(cx - r * 0.1, cy - r * 0.3, r * 0.42, Math.PI * 1.1, Math.PI * 1.55); ctx.stroke();
}

function drawBush(e) {
  const { x, y } = e;
  ell(x + 2, y + 1, 11, 3.5);
  ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
  ctx.fill();
  lobes(x, y, 1, CLUMP);
  ctx.strokeStyle = "rgba(245, 245, 247, 0.24)";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = e.amt > 0 ? "#1c2822" : "#18191a";
  ctx.fill();
  const n = Math.ceil((8 * e.amt) / e.max);
  if (!n) return;
  ctx.fillStyle = "#b5687f";
  ctx.beginPath();
  for (let i = 0; i < n; i++) { const [dx, dy] = e.dots[i]; ctx.moveTo(x + dx + 1.7, y + dy); ctx.arc(x + dx, y + dy, 1.7, 0, TAU); }
  ctx.fill();
}
// A crown or a clump: overlapping circles as one path, so one stroke and one fill draw it
const CROWN = [[-0.38, 0.18, 0.7], [0.4, 0.14, 0.66], [0, -0.22, 0.78]], CLUMP = [[-5, -5, 6.5], [5, -5.5, 6.5], [0, -9.5, 7]];
function lobes(x, y, k, set) {
  ctx.beginPath();
  for (const [ox, oy, r] of set) { ctx.moveTo(x + ox * k + r * k, y + oy * k); ctx.arc(x + ox * k, y + oy * k, r * k, 0, TAU); }
}

function drawSeam(e, t) {
  const k = e.amt / e.max;
  ell(e.x + 4, e.y + 8, 52, 15);
  ctx.fillStyle = "rgba(0, 0, 0, 0.32)";
  ctx.fill();
  ctx.lineJoin = "round";
  for (const b of e.rocks) {
    blobPath(e.x + b.x, e.y + b.y - 6, b.pts);
    ctx.fillStyle = "#232327";
    ctx.fill();
    ctx.strokeStyle = "rgba(245, 245, 247, 0.42)";
    ctx.lineWidth = 1.3;
    ctx.stroke();
  }
  if (k <= 0) return;
  const n = Math.ceil(e.flecks.length * k), glint = !calm && G.t - e.hit < 0.3;
  ctx.fillStyle = `rgba(206, 168, 76, ${(0.4 + 0.55 * k).toFixed(2)})`;
  for (let i = 0; i < n; i++) {
    const f = e.flecks[i], fx0 = e.x + f.x, fy = e.y + f.y - 6, s = f.s * (glint && i % 3 === Math.floor(t / 120) % 3 ? 1.5 : 1);
    ctx.beginPath(); ctx.moveTo(fx0, fy - s); ctx.lineTo(fx0 + s * 0.8, fy); ctx.lineTo(fx0, fy + s); ctx.lineTo(fx0 - s * 0.8, fy); ctx.closePath(); ctx.fill();
  }
}

function drawRock(e) {
  ell(e.x + 3, e.y + 2, e.r * 1.05, e.r * 0.4);
  ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
  ctx.fill();
  blobPath(e.x, e.y - e.r * 0.4, e.pts);
  ctx.fillStyle = "#1f1f23";
  ctx.fill();
  ctx.strokeStyle = "rgba(245, 245, 247, 0.32)";
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.strokeStyle = "rgba(245, 245, 247, 0.12)";
  ctx.beginPath(); ctx.arc(e.x - e.r * 0.2, e.y - e.r * 0.6, e.r * 0.45, Math.PI * 1.1, Math.PI * 1.6); ctx.stroke();
}

// Buildings, seen from above and in front: a wall with its door, a hipped roof (the barracks' is flat)
function drawBld(b, t, ghost) {
  const s = SIZE[b.kind], x0 = b.x - s.w / 2, x1 = b.x + s.w / 2, yf = b.y + s.d / 2, yb = b.y - s.d / 2;
  const eave = yf - s.h, back = yb - s.h, ridge = b.y - s.h - s.roof, ins = Math.min(s.w, s.d) * 0.32, o = 5;
  const rising = !ghost && !b.done;
  if (!ghost) { ctx.fillStyle = "rgba(0, 0, 0, 0.3)"; ctx.fillRect(x0 + 6, yb + 6, s.w, s.d); }
  if (rising) {
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = "rgba(245, 245, 247, 0.4)";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(x0, yb, s.w, s.d);
    ctx.setLineDash([]);
    const top = Math.min(back, ridge) - 6, hh = yf - top;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x0 - 12, yf - hh * b.prog - 1, s.w + 24, hh * b.prog + 4);
    ctx.clip();
  }
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = ghost || INK;
  const poly = (pts, fill) => {
    ctx.beginPath();
    pts.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.stroke();
  };
  if (b.kind === "barracks") {
    poly([[x0 - o, back + 4], [x1 + o, back + 4], [x1 + o, eave], [x0 - o, eave]], ROOF_F);
    ctx.strokeStyle = ghost || "rgba(245, 245, 247, 0.2)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let px = x0 + 8; px < x1; px += 12) { ctx.moveTo(px, back + 7); ctx.lineTo(px, eave - 3); }
    ctx.stroke();
    ctx.strokeStyle = ghost || INK;
    ctx.lineWidth = 1.4;
    // crossed spears on the roof
    const cx = b.x, cy = (back + eave) / 2 + 2;
    ctx.beginPath();
    ctx.moveTo(cx - 13, cy + 9); ctx.lineTo(cx + 13, cy - 9);
    ctx.moveTo(cx + 13, cy + 9); ctx.lineTo(cx - 13, cy - 9);
    ctx.stroke();
    ctx.fillStyle = ghost || INK;
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(cx + sx * 16, cy - 11); ctx.lineTo(cx + sx * 10, cy - 10); ctx.lineTo(cx + sx * 14, cy - 6); ctx.closePath(); ctx.fill(); }
  } else {
    poly([[x0 - o, back], [x1 + o, back], [x1 - ins, ridge], [x0 + ins, ridge]], ROOF_B);
    poly([[x0 - o, back], [x0 + ins, ridge], [x0 - o, eave]], ROOF_S);
    poly([[x1 + o, back], [x1 - ins, ridge], [x1 + o, eave]], ROOF_S);
    poly([[x0 + ins, ridge], [x1 - ins, ridge], [x1 + o, eave], [x0 - o, eave]], ROOF_F);
    // a few courses across the front slope
    ctx.strokeStyle = ghost || "rgba(245, 245, 247, 0.14)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = 1; k < 3; k++) {
      const f = k / 3, yy = ridge + (eave - ridge) * f;
      ctx.moveTo(x0 + ins + (-o - ins) * f + 3, yy); ctx.lineTo(x1 - ins + (o + ins) * f - 3, yy);
    }
    ctx.stroke();
    ctx.strokeStyle = ghost || INK;
    ctx.lineWidth = 1.4;
  }
  // the wall and its door
  ctx.fillStyle = WALL;
  ctx.fillRect(x0, eave, s.w, s.h);
  ctx.strokeRect(x0, eave, s.w, s.h);
  const dw = Math.max(10, s.w * 0.13), dh = s.h * 0.74;
  ctx.beginPath();
  ctx.moveTo(b.x - dw / 2, yf);
  ctx.lineTo(b.x - dw / 2, yf - dh + dw / 2);
  ctx.arc(b.x, yf - dh + dw / 2, dw / 2, Math.PI, 0);
  ctx.lineTo(b.x + dw / 2, yf);
  ctx.fillStyle = "#0b0b0c";
  ctx.fill();
  ctx.stroke();
  const win = (wx, wy, w, h) => { ctx.fillStyle = ghost ? "rgba(255, 214, 10, 0.2)" : "rgba(245, 232, 205, 0.2)"; ctx.fillRect(wx, wy, w, h); ctx.strokeRect(wx, wy, w, h); };
  if (b.kind === "tc") {
    for (const wx of [x0 + 14, x0 + 34, x1 - 43, x1 - 23]) win(wx, eave + 8, 9, 9);
    // a pole on the ridge, and its pennant (yellow once the village advances)
    const py = ridge - 32, wave = calm ? 0 : Math.sin(t / 380) * 1.6;
    ctx.beginPath(); ctx.moveTo(b.x, ridge + 2); ctx.lineTo(b.x, py); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b.x, py); ctx.quadraticCurveTo(b.x + 9, py + 2 + wave, b.x + 19, py + 5 + wave); ctx.lineTo(b.x, py + 11); ctx.closePath();
    ctx.fillStyle = ghost ? "transparent" : G.won ? Y : "rgba(245, 245, 247, 0.85)";
    ctx.fill();
  } else if (b.kind === "house") {
    win(x0 + 7, eave + 5, 8, 7);
    // a chimney, and a little smoke
    const cx = x1 - ins - 4, cy = ridge + 3;
    ctx.fillStyle = WALL;
    ctx.fillRect(cx - 3, cy - 9, 6, 10);
    ctx.strokeRect(cx - 3, cy - 9, 6, 10);
    if (!ghost && b.done && !calm) {
      for (let i = 0; i < 3; i++) {
        const k = ((t / 2600 + i / 3 + b.id * 0.13) % 1);
        ctx.fillStyle = `rgba(245, 245, 247, ${(0.07 * (1 - k)).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(cx + k * 9, cy - 12 - k * 22, 2.5 + k * 4, 0, TAU); ctx.fill();
      }
    }
  } else {
    for (const wx of [x0 + 12, x1 - 20]) win(wx, eave + 6, 8, 10);
  }
  if (rising) {
    ctx.restore();
    // scaffolding while it rises
    const top = Math.min(back, ridge) - 6, hh = (yf - top) * Math.max(0.25, b.prog);
    ctx.strokeStyle = "rgba(245, 245, 247, 0.4)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const px of [x0 - 4, x1 + 4]) { ctx.moveTo(px, yf + 1); ctx.lineTo(px, yf - hh); }
    ctx.moveTo(x0 - 4, yf - hh * 0.5); ctx.lineTo(x1 + 4, yf - hh * 0.5);
    ctx.moveTo(x0 - 4, yf); ctx.lineTo(x0 + 10, yf - hh * 0.5);
    ctx.moveTo(x1 + 4, yf); ctx.lineTo(x1 - 10, yf - hh * 0.5);
    ctx.stroke();
  }
}

// People: a small figure in white line, a load on the back, a tool going when at work
function drawPerson(u, t) {
  const m = u.kind === "militia", x = 0, y = 0, d = u.dir;
  ctx.save();
  ctx.translate(u.x, u.y);
  ctx.scale(FIG, FIG);
  const bob = u.moving ? Math.abs(Math.sin(u.ph)) * 1.6 : calm ? 0 : Math.sin(t / 700 + u.id) * 0.3;
  const sw = u.moving ? Math.sin(u.ph) * 2.4 : 0;
  ell(x, y, 7, 2.6);
  ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
  ctx.fill();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(x - 2, y - 6 - bob); ctx.lineTo(x - 2 + sw, y - 0.5);
  ctx.moveTo(x + 2, y - 6 - bob); ctx.lineTo(x + 2 - sw, y - 0.5);
  ctx.stroke();
  const top = y - 16 - bob, bw = m ? 10 : 9;
  // working: the tool swings, and lands on the beat
  const working = !u.moving && (u.st === "work" || u.st === "build");
  const ph = ((G.t + u.id * 0.37) / 0.85 + 0.12) % 1;
  const swing = ph < 0.12 ? -0.6 + (ph / 0.12) * 1.9 : 1.3 - ((ph - 0.12) / 0.88) * 1.9;
  if (!m && u.carry.amt > 0) load(u, x - d * 5.5, top + 3);
  ctx.fillStyle = m ? "#3a3a40" : "#2c2c31";
  ctx.beginPath();
  ctx.moveTo(x - bw / 2 + 3, top); ctx.arcTo(x + bw / 2, top, x + bw / 2, top + 10, 3); ctx.arcTo(x + bw / 2, top + 10, x - bw / 2, top + 10, 2);
  ctx.arcTo(x - bw / 2, top + 10, x - bw / 2, top, 2); ctx.arcTo(x - bw / 2, top, x + bw / 2, top, 3); ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 1.3;
  ctx.stroke();
  ctx.beginPath(); ctx.arc(x, top - 4, 3.6, 0, TAU);
  ctx.fillStyle = "#1b1b1e";
  ctx.fill();
  ctx.stroke();
  if (m) {
    ctx.beginPath(); ctx.arc(x, top - 4.4, 4.3, Math.PI * 1.05, Math.PI * 1.95); ctx.lineWidth = 2; ctx.stroke();  // a helmet
    const jab = u.fight && !calm ? Math.max(0, Math.sin(t / 70)) * 4 : 0;
    const sx = x + d * (6 + jab), sy = y - 2;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + d * 2.5, y - 31); ctx.stroke();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.moveTo(sx + d * 2.5, y - 36); ctx.lineTo(sx + d * 4.5, y - 30); ctx.lineTo(sx + d * 0.8, y - 30.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(x - d * 5, top + 6, 4.3, 0, TAU);
    ctx.fillStyle = "#26262b";
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(x - d * 5, top + 6, 1, 0, TAU); ctx.fill();
  } else if (working) {
    const kind = u.st === "build" ? "build" : u.task;
    const a = (kind === "food" ? 0.8 + Math.sin(t / 160 + u.id) * 0.25 : swing) * d;
    const hx = x + d * 3, hy = top + 3, len = kind === "food" ? 7 : 10;
    const ex = hx + Math.sin(a) * len, ey = hy - Math.cos(a) * len;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(ex, ey); ctx.stroke();
    if (kind === "wood") {  // an axe head
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(ex, ey, 2.4, a - Math.PI / 2 + (d > 0 ? 0 : Math.PI), a + Math.PI / 2 + (d > 0 ? 0 : Math.PI)); ctx.closePath(); ctx.fill();

    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x + 7, top - 10); ctx.lineTo(x + 7, top - 5); ctx.moveTo(x + 7, top - 2.6); ctx.lineTo(x + 7, top - 2.5); ctx.stroke();
  }
  ctx.restore();
}

function load(u, x, y) {
  const n = Math.max(1, Math.ceil((u.carry.amt / CARRY) * 3)), type = u.carry.type;
  ctx.lineWidth = 1;
  ctx.strokeStyle = "rgba(245, 245, 247, 0.6)";

    ctx.beginPath(); ctx.moveTo(x - 4.5, y); ctx.lineTo(x + 4.5, y); ctx.lineTo(x + 3, y + 5); ctx.lineTo(x - 3, y + 5); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#b5687f";

}

// A wolf, side on: low and slow while it prowls, stretched out when it runs
function drawWolf(w, t) {
  const run = w.st === "chase" || !!w.foe, ph = w.ph * (run ? 1.3 : 1);
  const bob = w.moving ? Math.abs(Math.sin(ph)) * (run ? 1.5 : 0.7) : 0;
  ell(w.x, w.y, 13 * FIG, 3 * FIG);
  ctx.fillStyle = "rgba(0, 0, 0, 0.38)";
  ctx.fill();
  ctx.save();
  ctx.translate(w.x, w.y);

  ctx.lineWidth = 1.5;
  const legs = [[-8, 0], [-5, Math.PI], [5, Math.PI], [8, 0]];
  ctx.beginPath();
  for (const [ox, o] of legs) {
    const s = w.moving ? Math.sin(ph + o) * (run ? 4 : 2.4) : 0;
    ctx.moveTo(ox, -7 - bob); ctx.lineTo(ox + s, -0.5);
  }
  ctx.stroke();
  ctx.fillStyle = "#2a2a2f";
  ctx.strokeStyle = "rgba(245, 245, 247, 0.78)";
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(-11, -9 - bob);
  ctx.quadraticCurveTo(-2, -15 - bob, 8, -12.5 - bob);
  ctx.quadraticCurveTo(11.5, -11 - bob, 11, -7 - bob);
  ctx.quadraticCurveTo(1, -4 - bob, -10, -6.5 - bob);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  const hy = (run ? -13 : -10.5) - bob, hx = w.bite && !calm ? Math.max(0, Math.sin(t / 60)) * 2 : 0;
  ctx.beginPath();
  ctx.moveTo(7 + hx, hy - 1.5);
  ctx.lineTo(10 + hx, hy - 7);
  ctx.lineTo(12 + hx, hy - 2.6);
  ctx.lineTo(18.5 + hx, hy + 0.6);
  ctx.lineTo(12.5 + hx, hy + 3);
  ctx.lineTo(8 + hx, hy + 3);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  const sway = calm ? 0 : Math.sin(t / 300 + w.id) * 1.4;
  ctx.moveTo(-10.5, -9.5 - bob);
  ctx.quadraticCurveTo(-17, -10.5 - bob + sway, -19.5, -5.5 - bob + sway);
  ctx.lineWidth = 2.6;
  ctx.stroke();
  ctx.fillStyle = "rgba(245, 245, 247, 0.9)";
  ctx.beginPath(); ctx.arc(12.4 + hx, hy - 0.4, 0.9, 0, TAU); ctx.fill();
  ctx.restore();
}

// The yellow ring under what's picked, and a dotted line to where it's going
function groundMarks(e, t) {
  const k = calm ? 1 : clamp((t - selAt) / 420, 0, 1), g = 1 + (1 - (1 - Math.pow(1 - k, 3))) * 0.6;
  let rx = 14, ry = 6, cx = e.x, cy = e.y;
  if (e.t === "bld") { const s = SIZE[e.kind]; rx = s.w / 2 + 16; ry = s.d / 2 + 14; cy = e.y + 4; }
  if (e.t === "unit") {
    let tx = null, ty = null;
    if (e.st === "go") { tx = e.gx; ty = e.gy; }
    else if (e.st === "home" || e.st === "flee") { tx = G.tc.x; ty = G.tc.y + SIZE.tc.d / 2; }
    else if (e.st === "tobuild" && e.bld) { tx = e.bld.x; ty = e.bld.y + SIZE[e.bld.kind].d / 2; }
    else if (e.kind === "militia" && e.foe) { tx = e.foe.x; ty = e.foe.y; }

function drawGhost(t) {

function drawFx(t) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i], k = (t - f.at) / (f.k === "text" ? 1300 : 900);
    if (k >= 1 || k < 0) { fx.splice(i, 1); continue; }
    if (f.k === "text") {

      ctx.textAlign = "center";
      ctx.fillStyle = `rgba(245, 245, 247, ${(0.8 * (1 - k)).toFixed(3)})`;

}

// The new age: rings of light from the Town Centre, once
function newAge(t) {
  const k = (t - stateAt) / 2600;
  if (state === "won" || calm) {
    const g = ctx.createRadialGradient(G.tc.x, G.tc.y, 0, G.tc.x, G.tc.y, 420);
    g.addColorStop(0, "rgba(255, 214, 10, 0.07)");
    g.addColorStop(1, "rgba(255, 214, 10, 0)");
    ctx.fillStyle = g;
    ctx.fillRect(G.tc.x - 420, G.tc.y - 420, 840, 840);
    return;
